/*
 ✨ Planit CSS Guide ✨

 1. Use relative units for responsive design:
    - Font sizes, paddings, and margins → use rem
    - Widths and heights → use %, vw, vh

 2. Use px for fixed-size or minimum-size elements:
    - Example:side panels, headers, footers, or control areas

 3. Positioning:
    - Use position:relative by default
    - Use position:absolute only when necessary for layout precision

 Keep styles simple, flexible, and mobile-friendly!

 📚 Planit CSS Naming Guide 📚

1. Naming Style:
   - Use kebab-case for all class names (lowercase words separated by hyphens)
     Example:.card-container, .nav-button, .progress-bar

2. Class Prefixing:
   - Components:use clear names + card context when needed
     Example:.taskit-card, .labelit-card, .growit-card
   - Child elements inside cards should stay simple:
     Example:.labelit-card .label, .taskit-card button

3. Utility Classes:
   - Use u- prefix for small utilities:
     Example:.u-margin-top, .u-padding-small, .u-text-center

4. State Modifiers:
   - Use is- or has- for dynamic states:
     Example:.is-active, .is-hidden, .has-error

5. Layout Helpers:
   - Use l- prefix for layout-related helpers:
     Example:.l-flex, .l-grid, .l-container

6. Consistency Rules:
   - Single responsibility per class (one job)
   - No camelCase, underscores, or uppercase
   - Favor clarity over brevity
   - Scope styles inside specific cards when appropriate to prevent clashes

 Keep it simple, keep it scoped, keep it beautiful!
 Remember:Clean names = clean mind!
*/

  --color-good-greyblue: #406a89;
  --color-good-green: #70a164; /* 349f4f;  6fac5f */
  --color-good-tan: #9fa372;
  --color-good-aqua: #318b8f;
  --color-good-mauve: #714872;
  --color-good-violet: #4e4c8c;

  --color-good-blue-lighter: #5484b0;
  --color-good-blue-light: #4a7dab; /* 10% shade for light and dark */
  --color-good-blue-dark: #316492;
  --color-good-green-light: #7eaa73;
  --color-good-green-dark: #65915a;
  --color-good-tan-light: #a8ac80;

  /* item rows */
  --color-standard-item: #366fa2;
  --color-completed-item: #70a164;
  --color-standard-item-hover: #366fa2;
  --color-completed-item-hover: #70a164;

  /* svg awooga animation */

  --eye-vertical-end: 8px;

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

*html {
  font-size: 62.5%;
}

body {
  font-family: "Inter", system-ui, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  font-size: 13px;
  transition: 0.3s ease;
  background-color: var(--color-bg);
  color: var(--color-text);
}

header {
  padding: 0.5rem 1rem 0rem 0.5rem;
  align-items: center;
  color: var(--color-text);
  background-color: var(--color-bg);
}

nav {
  display: flex; /* Added */
  align-items: center;
  gap: 0.4rem;
}

button {
  background: var(--color-nav-button);
}

input,
select {
  border-radius: 4px;
  border: #cccccc;
  padding: 0.32rem;
}

main.card-area {
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* Viewit section as flex row */
.card {
  display: flex;
  flex: 1;
  flex-direction: row;
  align-items: stretch;
  gap: 1rem;
  padding: 0.5rem 1rem 1rem 1rem;
}

/* Card main area (left side) */
.card-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--color-panel);
  padding: 0.6rem 1rem;
  border-radius: 8px;
}

/* Side panel (right side) */
.card-side-panel {
  flex: 0 0 300px;
  max-width: 200px;
  min-width: 300px;
  background: var(--color-panel);
  border-radius: 0.5rem;
  padding: 0.6rem 1rem;
  transition: flex-basis 0.8s ease, min-width 0.8s ease, max-width 0.8s ease,
    padding 0.8s ease;
}

.card-side-panel label,
h3,
button,
input[type="text"],
select {
  /* div, */
  white-space: nowrap;
}

.card-side-panel .watch-item {
  padding: 0.5rem;
  border: 1px solid #dddddd;
  margin-bottom: 0.5rem;
  cursor: pointer;
}

.card-side-panel .field {
  margin-bottom: 0.5rem;
}

.card-side-panel .panel-heading {
  font-size: 1rem;
  padding-top: 1rem;
}

.card-side-panel label {
  display: block;
  padding: 0.5rem 0rem;
  /* background: #00000044; */
}

.card-side-panel input,
select {
  padding: 0.32rem;
}

.card-main input[type="text"],
select,
input[type="number"] {
  width: auto;
  padding: 0.32rem;
}

.card-side-panel-collapsed {
  flex: 0 0 0px;
  min-width: 0;
  max-width: 0;
  padding: 0.6rem 0rem;
  /* opacity:0; */
  border: none;
  overflow: hidden;
}

.side-panel-hide {
  flex: 0 0 0px;
  overflow: hidden;
  padding: 0;
}

nav .show-navigation-button {
  justify-content: flex-end;
  display: none;
  margin-right: 0.7rem;
}
nav .nav-side-panel-button{display: none;}

/* Nav  */
.nav-icon {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: #ffffff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.planit-icon {
  width: 34px;
  height: 34px;
}

.card-nav-icon {
  width: 26px;
  height: 26px;
  align-items: center;
}

.nav-item {
  display: inline-flex;
  font-size: 1.5rem;
  margin: 0rem 0.5rem;
}

.nav-button,
.card button,
.modal button {
  display: flex;
  align-items: center;
  gap: 0.5em;
  padding: 0.5em 0.7em;
  margin: 0.4em 0.1em;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.2s;
  color: #ffffff;
}

.nav-button:hover,
.modal button:hover {
  /*opacity: 0.9;*/
  background-color: var(--color-nav-button-hover);
}

.modal-content{margin: 0.2rem 0rem; }
.modal-text{margin: 1rem 0rem; }
.modal-button-container button{display: inline-block;}

.navigation-buttons {
  display: flex;
  gap: 0.4em;
  flex-direction: row;
  overflow: hidden;
}

.card button {
  display: inline-block;
  background-color: var(--color-button);
}

.card button:hover {
  background-color: var(--color-button-hover);
}

.nav-button.active {
  background-color: var(--color-nav-button-active);
  font-weight: bold;
}

/* --- universal generic css--- */
.planit-hidden {
  display: none;
} /*index shopit menuit etc*/
.planit-flex {
  display: flex;
} /*taskit */
.planit-left-1 {
  margin-left: 1rem;
} /*taskit */
.planit-inline {
  display: inline-flex;
} /*menuit */
.planit-inline-center {
  display: inline-flex;
  align-items: center;
} /*taskit */
.planit-gap {
  gap: 0rem 0.5rem;
}
.planit-fill {
  flex: 1;
  align-items: center;
}
.planit-margin-bottom {
  margin-bottom: 10px;
} /*buildit */
.planit-wrap {
  flex-wrap: wrap;
}

.card-navigation {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0rem 0.5rem;
}

.small-input {
  width: 30%;
  margin-right: 1rem;
}

.button-group {
  display: flex;
  gap: 2px;
  margin-left: 1rem;
}

.button-group-panel {
  margin-left: 0rem;
}

.button-group .btn {
  margin: 0px;
  cursor: pointer;
  transition: background 0.1s;
  border-radius: 0px;
}

.button-group .btn:first-child {
  border-radius: 4px 0px 0px 4px;
}

.button-group .btn:last-child {
  border-radius: 0px 4px 4px 0px;
}

/* .svg-nav-button:focus {outline:2px solid 009688;} */
.svg-nav-button:hover {
  opacity: 0.8;
}

/* --- card --- */
.card .gen-item {
  display: flex;
  padding: 0.5rem 1rem;
  margin-bottom: 4px;
  background: var(--color-standard-item);
  border-radius: 4px;
  cursor: pointer;
  color: #ffffff;
  gap: 0.3rem 1rem;
}
.card .gen-item div {
  flex: 1;
}
.card .gen-item:hover {
  background: var(--color-standard-item-hover);
}
.card .svg-nav-button {
  border: none;
  padding: 0rem 0.5rem;
  margin: 0rem 1rem;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  color: #f1f1f1;
  display: inline-flex;
  align-items: center;
}

/* --- Viewit --- */
.viewit-card .multi-column-container {
  column-count: 5;
  column-gap: 20px;
  max-height: 80vh;
  overflow-y: auto;
}
.viewit-card .view-block {
  padding: 0.5rem;
  color: #ffffff;
  margin-bottom: 0.2rem;
  break-inside: avoid;
} /* background:rgba(0,0,0,0.1); */
.viewit-card .view-title {
  padding: 0.8rem;
  background: var(--color-nav-button);
  color: #ffffff;
  font-size: 1.2rem;
  display: flex;
  cursor: pointer;
  border-radius: 3px 3px 0px 0px;
}
.viewit-card .view-title-text {
  flex: 1;
}
.viewit-card .view-content {
  padding: 0.5rem;
  background: #fcfcfc;
  color: #000000;
  border-radius: 0px 0px 3px 3px;
}
.viewit-card .view-item {
  display: flex;
  align-items: center;
  padding: 0.3rem 0.5rem;
  background: #00000008;
  margin-bottom: 0.2rem;
  border-radius: 3px;
}
.viewit-card .view-item-title {
  flex: 1;
  margin-left: 0.5rem;
}
.viewit-card .view-item-svg {
  width: 1.4rem;
  height: 1.4rem;
}
.viewit-card .colour-picker-container {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-top: 0.5rem;
}
.viewit-card .color-picker-label {
  flex: 1;
}
.viewit-card .emoji-block {
  font-size: 1.1rem;
}
.viewit-card .color-picker {
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  background-color: transparent;
  border: none;
  cursor: pointer;
}
.viewit-card .color-picker::-webkit-color-swatch-wrapper {
  padding: 0;
}
.viewit-card .color-picker::-webkit-color-swatch {
  border-radius: 50%;
  border: none;
}
.viewit-card .custom-color-pickers {
  border-radius: 4px;
  background: var(--color-shade-light);
  padding: 0.5rem;
}

.viewit-card .highlight-no {
  color: #888888;
}

@media (max-width: 1024px) {
  .viewit-card .multi-column-container {
    column-count: 3;
  }
} /* Medium screens:tablets etc. */
@media (max-width: 768px) {
  .viewit-card .multi-column-container {
    column-count: 2;
  }
} /* Smaller screens:phones in landscape */
@media (max-width: 480px) {
  .viewit-card .multi-column-container {
    column-count: 1;
    max-height: none;
  }
} /* Mobile phones:portrait mode */

.timer-container{font-family:sans-serif; margin:1em auto; text-align:center;}
.timer-container div{margin-bottom:0.5rem;}
.timer-display{margin-top:0.5rem; font-size:3.6em; text-align:center; align-content:center; height:213px; color:#35484e;}
.counter-display{position:relative;}
.timer-container button{display:inline-block;}
.timer-svg-container{position:absolute; top:0; left:0; width:100%; align-content:center;}

.taskit-card .day-header {
  font-size: 1rem;
}
.taskit-card .task-block {
  margin-bottom: 20px;
  min-height: 30px;
}
.taskit-card .task-block:empty {
  background: #00000010;
}
.taskit-card .task-item {
  display: flex;
  align-items: center;
  background-color: #ffffff;
  color: #182e1c;
  margin: 5px 0;
  padding: 5px;
  border-radius: 2px;
  cursor: pointer;
}
.taskit-card .task-item:hover .drag-handle {
  opacity: 1;
}
.taskit-card .task-title {
  flex-grow: 1;
}
.taskit-card .task-repeat,
.taskit-card .task-status,
.taskit-card .task-delete {
  margin-right: 0.4rem;
  width: 20px;
  height: 20px;
}
.taskit-card .add-item {
  margin-top: 10px;
}
.taskit-card .complete {
  background-color: var(--color-good-green-light);
  color: #ffffff;
} /* 83B178 */
.taskit-card .not-started {
  background-color: #e0e0e0;
}
.taskit-card .started {
  background-color: var(--color-good-blue);
  color: #ffffff;
}
.taskit-card .ignore {
  background-color: #fcfcfc;
  color: #000000;
  opacity: 0.1;
}
.taskit-card .icon {
  width: 20px;
  height: 20px;
  stroke: #00000090;
}
.taskit-card .column {
  flex: 1;
}
.taskit-card .task-list .task-item {
  cursor: pointer;
}
.taskit-card .task-list .sortable-chosen {
  background-color: #f1f1f1;
}
.taskit-card .task-list .sortable-ghost {
  opacity: 0.4;
}
.taskit-card .drag-handle {
  cursor: pointer;
  margin-right: 0.4rem;
  margin-left: 0.4rem;
  opacity: 0;
}
.taskit-card .week-progress {
  margin: 10px 0;
  font-size: 0.9em;
}
.taskit-card .progress-bar {
  display: flex;
  height: 20px;
  background: #c1c1c1;
  border-radius: 11px;
  overflow: hidden;
  position: relative;
}
.taskit-card .progress-fill {
  width: 0%;
  background: var(--color-good-green);
} /* 6eab60 */
.taskit-card .started-fill {
  width: 0%;
  background: var(--color-good-blue);
}
.taskit-card .progress-text {

/* --- Toast --- */
.toast {
  z-index: 1100;
  position: fixed;
  bottom: 0px;
  left: 0px;
  width: 100%;
  margin: 0px;
  padding: 10px 20px;
  color: #ffffff;
  font-size: 0.9rem;
  transition: opacity 0.3s ease;
  opacity: 0;
  pointer-events: none;
}
.toast.show {

  pointer-events: auto;
}
.toast.success {

}
.toast.error {

}
.toast.info {

}

/* --- Modal --- */
/* Modal background */
.modal-backdrop {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #00000060;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
/* Modal box */
.modal {
  background: #ffffff;
  padding: 1.5rem;
  border-radius: 10px;
  max-width: 400px;
  width: 90%;
  box-shadow: 0 10px 30px #00000030;
  position: relative;
  color: #111111;
}
.modal h2 {
  margin-top: 0;
}
.modal .close {
  position: absolute;
  top: 10px;
  right: 14px;
  font-size: 1.5rem;
  color: #898989;
  cursor: pointer;
}
.modal .close:hover {
  color: #000000;
}
.modal-heading {
  font-size: 1.2rem;
}

/* --- Toggle switch --- */
.switch {
  position: relative;
  display: inline-block;
  width: 36px;
  height: 20px;
}
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}
/* Slider track */
.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #c1c1c1;
  transition: 0.3s;
  border-radius: 34px;
}
/* Knob */
.slider::before {
  position: absolute;
  content: "";
  height: 14px;
  width: 14px;
  left: 4px;
  bottom: 3px;
  background-color: white;
  transition: 0.3s;
  border-radius: 50%;
}
/* When checked */
input:checked + .slider {
  background-color: var(--color-good-green);
}
input:checked + .slider::before {
  transform: translateX(14px);
}

.card .button-icon-container {

.button-icon {

.rounded-checkbox {
  width: 15px;

  appearance: none;
  -webkit-appearance: none;

}
.rounded-checkbox:checked {
  appearance: auto;
  clip-path: circle(50% at 50% 50%);
  background-color: blue;
  border: 2px solid blue;
  outline: none;
}

  function createPathString(posList, closePath) {
    let d = "";
    posList.forEach((pos, index) => {
      if (index == 0) {
        d += `M ${pos.x} ${pos.y}`;
      } else if (pos.type === "Q") {
        d += ` ${pos.type} ${pos.controlPointAx} ${pos.controlPointAy} ${pos.x} ${pos.y}`;
      } else {
        // Assumes line to
        d += ` L ${pos.x} ${pos.y}`;
      }
    });
    if (closePath) d += " Z";
    return d;
  }

  function createRect(id, pos, width, height, rx, ry, layer, className) {
    var rect = document.createElementNS(svgns, "rect");
    rect.setAttributeNS(null, "x", pos.x);
    rect.setAttributeNS(null, "y", pos.y);
    rect.setAttributeNS(null, "width", width);
    rect.setAttributeNS(null, "height", height);
    rect.setAttributeNS(null, "rx", rx);
    rect.setAttributeNS(null, "ry", ry);
    if (id) rect.setAttributeNS(null, "id", id);
    if (className) rect.setAttributeNS(null, "class", className);
    layer.appendChild(rect);
  }

  function createText(id, pos, textStr, layer, className) {
    var text = document.createElementNS(svgns, "text");
    text.setAttributeNS(null, "x", pos.x);
    text.setAttributeNS(null, "y", pos.y);
    const textNode = document.createTextNode(textStr);
    text.appendChild(textNode);
    if (id) text.setAttributeNS(null, "id", id);
    if (className) text.setAttributeNS(null, "class", className);
    layer.appendChild(text);
  }

  function createEllipse(id, pos, rx, ry, layer, className) {
    const ellipse = document.createElementNS(svgns, "ellipse");
    if (id) ellipse.setAttributeNS(null, "id", id);
    if (className) ellipse.setAttributeNS(null, "class", className);
    ellipse.setAttributeNS(null, "cx", pos.x);
    ellipse.setAttributeNS(null, "cy", pos.y);
    ellipse.setAttributeNS(null, "rx", rx);
    ellipse.setAttributeNS(null, "ry", ry);
    layer.appendChild(ellipse);
  }

  function createCircle(id, pos, r, fill, stroke, strokeWidth, layer, className) {
    const circle = document.createElementNS(svgns, "circle");
    if (id) circle.setAttributeNS(null, "id", id);
    if (className) circle.setAttributeNS(null, "class", className);
    circle.setAttributeNS(null, "cx", pos.x);
    circle.setAttributeNS(null, "cy", pos.y);
    circle.setAttributeNS(null, "r", r);
    circle.setAttributeNS(
      null,
      "style",
      "fill:" +
        fill +
        "; stroke:" +
        stroke +
        ";  opacity:1; stroke-width:" +
        strokeWidth +
        ";"
    );
    layer.appendChild(circle);
  }

  function niceNum(num) {
    const numType = typeof num;
    if (numType == "string") num = Number(num);
    if (numType == "undefined" || num == null) num = 0;
    const decimalPlaces = 3;
    num = Number.isInteger(num)
      ? Number(num)
      : Number(num.toFixed(decimalPlaces));
    return parseFloat(num); //removes trailing zeros
  }

  function lineAngle(pos1, pos2) {
    var deltaX = pos2.x - pos1.x;
    var deltaY = pos2.y - pos1.y;
    var rad = Math.atan2(deltaY, deltaX); // In radians
    var deg = rad * (180 / Math.PI); // In degrees
    if (deg < 0) {
      deg += 360;
    }
    return Number(deg.toFixed(5));
  }

  function calculateSquareDiagonal(side) {
    if (typeof side !== "number" || side < 0) {
      throw new Error("Side must be a non-negative number.");
    }
    // Using the Pythagorean theorem: diagonal^2 = side^2 + side^2
    return side * Math.SQRT2;
  }

  // Moves left and right arms independently
  function moveArms(armBallJoint, elbowBallJoint, pointer, side) {
    const elbowWidth = 0.7;
    const curveDistance = 1.3; //from elbow

    //finds point between lines
    const upperArmPoint = findPointOnLineDistance(
      elbowBallJoint,
      armBallJoint,
      2
    ); //equal length
    const lowerArmPoint = findPointOnLineDistance(elbowBallJoint, pointer, 2); //equal length
    const inbetweenPoint = findPointOnLine(upperArmPoint, lowerArmPoint, 0.5); //between

    const angle = lineAngle(inbetweenPoint, elbowBallJoint);

    if (angle > 180) {
      var elbowOuterRight = findPointOnLineDistance(
        elbowBallJoint,
        inbetweenPoint,
        -elbowWidth
      ); //extend
      var elbowInnerRight = findPointOnLineDistance(
        elbowBallJoint,
        inbetweenPoint,
        elbowWidth
      );
    } else {
      var elbowOuterRight = findPointOnLineDistance(
        elbowBallJoint,
        inbetweenPoint,
        elbowWidth
      );
      var elbowInnerRight = findPointOnLineDistance(
        elbowBallJoint,
        inbetweenPoint,
        -elbowWidth
      ); //extend
    }

    //where arm joins to body
    const shoulderRight = rotateAroundPoint(armBallJoint, -90, 1); //90 ok if body does not tilt
    const armPitRight = rotateAroundPoint(armBallJoint, 90, 1);

    //curve pos upper arm
    const outerUpperArmRight = findPointOnLineDistance(
      elbowOuterRight,
      shoulderRight,
      curveDistance
    );
    const innerUpperArmRight = findPointOnLineDistance(
      elbowInnerRight,
      armPitRight,
      curveDistance
    );

    //curve pos lower arm
    const outerLowerArmRight = findPointOnLineDistance(
      elbowOuterRight,
      pointer,
      curveDistance
    );
    const innerLowerArmRight = findPointOnLineDistance(
      elbowInnerRight,
      pointer,
      curveDistance
    );

    if (side == "right") {
      awoogaBody[2] = new Point("L", shoulderRight.x, shoulderRight.y);
      awoogaBody[3] = new Point(
        "L",
        outerUpperArmRight.x,
        outerUpperArmRight.y
      );
      awoogaBody[4] = new Point(
        "Q",
        outerLowerArmRight.x,
        outerLowerArmRight.y,
        elbowOuterRight.x,
        elbowOuterRight.y
      );
      awoogaBody[5] = new Point("L", pointer.x, pointer.y);
      awoogaBody[6] = new Point(
        "L",
        innerLowerArmRight.x,
        innerLowerArmRight.y
      );
      awoogaBody[7] = new Point(
        "Q",
        innerUpperArmRight.x,
        innerUpperArmRight.y,
        elbowInnerRight.x,
        elbowInnerRight.y
      );
      awoogaBody[8] = new Point("L", armPitRight.x, armPitRight.y);
    } else {
      awoogaBody[11] = new Point("L", armPitRight.x, armPitRight.y);
      awoogaBody[12] = new Point(
        "L",
        innerUpperArmRight.x,
        innerUpperArmRight.y
      );
      awoogaBody[13] = new Point(
        "Q",
        innerLowerArmRight.x,
        innerLowerArmRight.y,
        elbowInnerRight.x,
        elbowInnerRight.y
      );
      awoogaBody[14] = new Point("L", pointer.x, pointer.y);
      awoogaBody[15] = new Point(
        "L",
        outerLowerArmRight.x,
        outerLowerArmRight.y
      );
      awoogaBody[16] = new Point(
        "Q",
        outerUpperArmRight.x,
        outerUpperArmRight.y,
        elbowOuterRight.x,
        elbowOuterRight.y
      );
      awoogaBody[17] = new Point("L", shoulderRight.x, shoulderRight.y);
    }
  }

  function moveBody(center, width, rotation) {
    const diagonalLength = calculateSquareDiagonal(width) * 0.5;
    let angle = 45 + rotation; //start bottom right;
    let indexList = [9, 10, 0, 1];
    const incriment = 90;
    for (let i = 0; i < 4; i++) {
      const pos = rotateAroundPoint(center, angle, diagonalLength);
      awoogaBody[indexList[i]].x = pos.x;
      awoogaBody[indexList[i]].y = pos.y;
      angle += incriment;
    }
  }

  function mapRange(value, inMin, inMax, outMin, outMax) {
    return ((value - inMin) * (outMax - outMin)) / (inMax - inMin) + outMin;
  }

  // Update the armature positions for body and and arms
  function moveAll() {
    const center = armatureData.bodyCenter.liveposition;

    // Shadow moves with the body

    const shadowOpacity = mapRange(
      armatureData["bodyCenter"].liveposition.y,
      11,
      14,
      0.02,
      0.07
    );
    dom.awoogaShadow.setAttribute("opacity", shadowOpacity);
    const shadowWidth = mapRange(
      armatureData["bodyCenter"].liveposition.y,
      11,
      14,
      12,
      14
    );
    dom.awoogaShadow.setAttribute("width", shadowWidth);
    dom.awoogaShadow.setAttribute("height", shadowWidth / 6);
    dom.awoogaShadow.setAttribute("x", center.x - shadowWidth * 0.5);

    // Eyes move with the body
    moveEyes(center, null);

    // You moves with the body
    moveYou(center, -10);

    // Create the four corner points for the body and set in awooga body
    //bodyWidth is width 12
    moveBody(center, bodyWidth * scale, bodyRotation);

    // Move Arms
    const armBallJointRight = armatureData.armRight.liveposition;
    const elbowBallJointRight = armatureData.elbowRight.liveposition;
    const pointerRight = armatureData.pointerRight.liveposition;

    const armBallJointLeft = armatureData.armLeft.liveposition;
    const elbowBallJointLeft = armatureData.elbowLeft.liveposition;
    const pointerLeft = armatureData.pointerLeft.liveposition;

    moveArms(armBallJointRight, elbowBallJointRight, pointerRight, "right");
    moveArms(armBallJointLeft, elbowBallJointLeft, pointerLeft, "left");

    // Update the SVG body path
    const path = createPathString(awoogaBody, true);
    if (path.includes("null") || path.includes("Infinity")) {
      //ignore
    } else {
      dom.awoogaBody.setAttribute("d", path);
    }
    //updateCodeOutput();
  }

  function animatePoint(
    target,
    duration = 1000,
    easing = "easeOutQuad",
    armature
  ) {
    return new Promise((resolve) => {
      const start = { ...armatureData[armature].offsetPosition };
      const startTime = performance.now();
      const animatedPoint = armatureData[armature].offsetPosition;

      const ease =
        {
          linear: (t) => t,
          easeInQuad: (t) => t * t,
          easeOutQuad: (t) => t * (2 - t),
          easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
        }[easing] || ((t) => t);

      function step(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = ease(progress);

        animatedPoint.x = niceNum(start.x + (target.x - start.x) * eased);
        animatedPoint.y = niceNum(start.y + (target.y - start.y) * eased);

        if (armature === "bodyCenter") {
          moveBodyCenter();
          moveAll();
        } else {
          moveArmature(armature);
          moveAll();
        }

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          resolve();
        }
      }
      requestAnimationFrame(step);
    });
  }

  function wait(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  async function animateArmature(
    armature,
    offset,
    duration,
    easing = "easeInQuad",
    delay = 0
  ) {
    const liveOffset = armatureDataGetLiveOffset(armature);
    armatureData[armature].offsetPosition.x = liveOffset.x;
    armatureData[armature].offsetPosition.y = liveOffset.y;
    await wait(delay); // delay before starting animation
    await animatePoint(offset, duration, easing, armature); // wait for animation to complete
  }

  function stopAnimation() {
    if (animationSequence.isRunning) {
      animationSequence.index = -1; // Will incriment to 0
      animationSequence.animations = ["restPosition"]; // And run this
    } else {
      animationSequence.run("restPosition");
    }
    animationSequence.isRunning = false;
  }

  function reflowAnimation(newSequence, chain) {
    // Place directly after last animation move or chain
    if (!chain) {
      // Remove after current index using 1000 as a large number
      animationSequence.animations.splice(animationSequence.index + 1, 1000);
    }
    // Add the new sequence as an array
    const newSequenceList = newSequence.split(",");
    animationSequence.animations =
      animationSequence.animations.concat(newSequenceList);
    if (!animationSequence.isRunning) {
      animationSequence.run(newSequence);
    }
  }

  const animationSequence = {
    animations: [],

    isRunning: false,

    async run(animations) {
      //if (animations && this.isRunning) return false; //ignore if running sequence
      if (animations) {
        this.animations = animations.split(",");
        this.index = 0;
        //this.isRunning = true;
        //this.stop = false;
      } else {
        this.index++;
      }

      const aniToRun = this.animations[this.index];
      this.lastRun = aniToRun;

        this.isRunning = true;
        if (dom.trackAwooga) {
          const outputStringHTML = this.animations

          //dom.trackAwooga.innerHTML = outputStringHTML + " | " + this.lastRun + " | " + this.emoji;
        }
        await awoogaAnimations[aniToRun]();
        this.lastRun = aniToRun;
      } else {
        this.isRunning = false;
        //this.lastRun = aniToRun;
      }
    },
  };

    animateArmature("pointerRight", { x: 0, y: 0 }, 2000, null, 2000);
    animateArmature("elbowLeft", { x: 0, y: 0 }, 1000, null, 0);
    animateArmature("elbowRight", { x: 0, y: 0 }, 1000, null, 0);
    animateArmature("bodyCenter", { x: -4, y: 0 }, 2000, "linear", 4000);
    //animateArmature('armLeft', {x:0,y:-3}, 1000, null, 4500);
    //animateArmature('armRight', {x:0,y:-3},1000, null, 4500);
    animateArmature("elbowLeft", { x: 0, y: -3 }, 1000, null, 4500);
    animateArmature("elbowRight", { x: 0, y: -3 }, 1000, null, 4500);
    animateArmature("pointerLeft", { x: 2, y: -18 }, 1000, null, 4500);
    animateArmature("pointerRight", { x: -2, y: -18 }, 1000, null, 4500);
    //updateYouEmoji('🌿️')
  }

  async function animateSequence() {
    await animatePoint({ x: 0, y: 0 }, 2000, "easeInQuad", "bodyCenter");
    await animatePoint({ x: -2, y: 0 }, 2000, "easeInQuad", "bodyCenter");
    updateYouEmoji("🌿️");
  }

  function updateCodeOutput() {
    const codeOutput = document.getElementById("codeOutput");
    codeOutput.innerHTML = "";
    let newList = ["bodyCenter"];
    let newList2 = newList.concat(armatureList);
    newList2.forEach((armature) => {
      //const offset = armatureData[armature].offsetPosition;
      let offset = armatureDataGetLiveOffset(armature);
      if (armature === "bodyCenter") {
        offset = getPos(armatureData.bodyCenter.liveposition, { x: 12, y: 13 });
      }
      codeOutput.innerHTML += `animateArmature('${armature}', {x:${niceNum(
        offset.x
      )},y:${niceNum(offset.y)}},1000, null, 0);\n`;
    });
  }

  function initDomReferencesAnimation() {
    setUpArmature();
    dom.root = document.documentElement;
    dom.animationSelect = document.getElementById("animationSelect");
    dom.animationButtons = document.getElementById("animationButtons");
    // --- Layers ---
    dom.designSvg = document.getElementById("designSvg");
    //dom.layerShadow = document.getElementById('layerShadow');
    dom.layerBody = document.getElementById("layerBody");
    dom.layerEyes = document.getElementById("layerEyes");
    dom.layerYou = document.getElementById("layerYou");
    dom.layerTest = document.getElementById("layerTest");
    dom.layerBubble = document.getElementById("layerBubble");
    // --- Awooga ---
    dom.awoogaShadow = document.getElementById("awoogaShadow");
    dom.awoogaBody = document.getElementById("awoogaBody");
    dom.eyeLeft = document.getElementById("eyeLeft");
    dom.eyeRight = document.getElementById("eyeRight");
    dom.trackAwooga = document.getElementById("trackAwooga");
    // --- You ---
    dom.youEmoji = document.getElementById("youEmoji");
    dom.bubbleOne = document.getElementById("bubbleOne");
    dom.bubbleOneText = document.getElementById("bubbleOneText");
    animationSequence.run("restPosition"); //wave,handsInTheAir,wave
  }

  // --- Expose Only Required Functions ---
  window.dom = dom;
  window.armatureData = armatureData;
  window.armatureDataLiveRestPos = armatureDataLiveRestPos;

  window.animateSequence = animateSequence;
  //window.initAnimation = initAnimation;
  window.updateYouEmoji = updateYouEmoji;
  window.moveAll = moveAll;
  window.moveArmature = moveArmature;
  window.initSvgAnimations = initSvgAnimations;
  window.awoogaAnimations = awoogaAnimations;
  window.animationSequence = animationSequence;
  window.stopAnimation = stopAnimation;
  window.reflowAnimation = reflowAnimation;

  function initSvgAnimations() {
    initDomReferencesAnimation();
    armatureData.pointerLeft.sync.x = false;
    armatureData.pointerRight.sync.x = false;
    armatureData.pointerRight.sync.y = false;
    armatureData.armRight.sync.y = false;
    animatePoint({ x: 0, y: 0 }, 1000, "easeInQuad", "bodyCenter");
  }

      function adjustHex(hex, percent) {
        let num = parseInt(hex.slice(1), 16);
        let amt = Math.round(2.55 * percent);
        let r = Math.min(255, Math.max(0, (num >> 16) + amt));
        let g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amt));
        let b = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
        return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
      }

      function startAwoogaIdleLoop() {
       clearTimeout(awoogaTimer);
        const idleAnimations = ['wave','hello','headRock','restPosition','armsLow','blink','eyeScan','raiseEyes','moveLeft','moveRight'];
        async function triggerRandomAnimation() {
          // Random idle animation choice
          const action = idleAnimations[Math.floor(Math.random() * idleAnimations.length)];
          // Trigger it if it exists
          if (awoogaAnimations[action]) {
            //await awoogaAnimations[action]();
            if(!animationSequence.isRunning){
              await animationSequence.run(action + ',restPosition');
            }
          }else{
            //console.log('action not found:', action);
          }
          // Schedule the next animation after a random delay (e.g. 3 to 10 seconds)
          const nextDelay = 3000 + Math.random() * 7000;
          awoogaTimer = setTimeout(triggerRandomAnimation, nextDelay);
        }
        // Kick it off
        triggerRandomAnimation();
      }
    
    function getMealTime() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const totalMinutes = hours * 60 + minutes;
    
      // Define time ranges in total minutes since midnight
      const breakfastStart = 6 * 60;       // 6:00
      const breakfastEnd = 10 * 60;        // 10:00
      const lunchStart = 10 * 60 + 1;      // 10:01
      const lunchEnd = 14 * 60;            // 14:00
      const dinnerStart = 14 * 60 + 1;     // 14:01
      const dinnerEnd = 23 * 60;           // 23:00
    
      if (totalMinutes >= breakfastStart && totalMinutes <= breakfastEnd) {
        return 'breakfast';
      } else if (totalMinutes >= lunchStart && totalMinutes <= lunchEnd) {
        return 'lunch';
      } else if (totalMinutes >= dinnerStart && totalMinutes <= dinnerEnd) {
        return 'dinner';
      } else {
        return 'late night snack or sleep!';
      }
    }

      function limitedRandomSelection(arr, len){
        if(arr.length===1){
          return arr;
        }
        arr = JSON.parse(JSON.stringify(arr)); //clone
        //remove random
        const newLength = (arr.length<len)? arr.length:len;
        do{
          arr.splice(Math.floor(Math.random()*arr.length), 1);
        }
        while(arr.length>newLength);
        return arr;
      }
    
      function randomFromList(arr){
        return arr[Math.floor(Math.random() * arr.length)];;
      }
    
      function sorter(arr, fields) {
        return arr.sort((a, b) => {
          for (let field of fields) {
            let [key, order = "asc"] = field.split(":");
            let valA = typeof a[key] === "string" ? a[key].toLowerCase() : a[key];
            let valB = typeof b[key] === "string" ? b[key].toLowerCase() : b[key];
    
            if (valA < valB) return order === "asc" ? -1 : 1;
            if (valA > valB) return order === "asc" ? 1 : -1;
            // if equal → move to next field
          }
          return 0;
        });
      }
    
      function createViewWidget(title, cardName, dataList, dataListIndex, emoji, fallbackText, displayLimit, highlight, sort, displayText, filters, id, isHidden){ 
        const cardData = getPlanitSection(cardName);
        let data = cardData[dataList]; //one level
        let highlightValue = null;
        if(highlight?.value){
          highlightValue = highlight.value;
          if(highlight.value === 'getMealTime') highlightValue = getMealTime();
        }
        
        if(!data){
          createViewitBox(title, [{emoji:emoji.defaultEmoji, title:fallbackText}], cardName, emoji.defaultEmoji, isHidden);
          return;
        }
    
        if(dataListIndex){
          data = data[dataListIndex.index][dataListIndex.name]; //second level
        }
    
        let filteredList = JSON.parse(JSON.stringify(data));
    
        filters.forEach(filter => {
          //console.log(title, filter.value);
          //if(filter.value === 'Tuesday') filter.value = 'getMealTime';
          if(highlight?.value === 'breakfast'){
            highlight.value = 'getMealTime';
            //console.log(title, 'highLight', highlight)
            saveToLocalStorage();
          }
          
          let filterValue = filter.value;
          if(filter.value === 'todayStr') filterValue = todayStr; //use the live value
          if(filter.value === 'currentDay') filterValue = currentDay;
    
          if(filter.operation === 'equalto'){
            filteredList = filteredList.filter(e => e[filter.name] === filterValue);
          }else if(filter.operation === 'notequalto'){
            filteredList = filteredList.filter(e => e[filter.name] != filterValue);
          }else if(filter.operation === 'includes'){
            filteredList = filteredList.filter(e => e[filter.name].includes(filterValue));
          }else if(filter.operation === 'notincludes'){
            filteredList = filteredList.filter(e => !e[filter.name].includes(filterValue));
          }
        });
    
        if(filteredList.length === 0){
          filteredList = [{emoji:emoji.defaultEmoji, title:fallbackText}];
        }else{
            filteredList.forEach(item => {
            let dText = '';
            displayText.forEach(property => {
              dText += ' ' + item[property];
            })
              item.title = dText.trim();
              if(emoji.onlyDefault){
                const itemEmoji = (emoji.random)? randomFromList(emoji.random):emoji.defaultEmoji;
                item.emoji = itemEmoji;
              }
              if(highlight){            
                item.highLight = (item[highlight.name] === highlightValue)? 'yes':'no';
              }else{
                item.highLight = 'yes';
              }          
            })
        }
    
        if(displayLimit || !settingsData.isShowAll){
          const howManyRandom = (settingsData.isShowAll)? displayLimit:1;
          filteredList = limitedRandomSelection(filteredList, howManyRandom)
        }
    
        if(sort){
          filteredList = sorter(filteredList, sort)
        }
    
        createViewitBox(title, filteredList, cardName, emoji.defaultEmoji, id, isHidden);
      }

(function () {
  // Card logic for taskit
  const init = function() {
(function () {
      'use strict';
    
      // --- Global Declarations ---
      //remove repeating:[] from below line?
      let taskData = {taskGroups:[], currentTaskGroupId:'',tasks:[], repeating:[], isWeekly:true, isDisplayComplete:true, isPanelOpen:true, updatedAt:timeStamp(), card:'taskit'};
      let currentTaskGroup = {};
      let currentTask = null;
      let daysOfWeek = [];
      let repeatOrder = [];
      const todaysDate = new Date();
      let currentMonday = getMonday(todaysDate); //planit.js
      let currentDay = currentMonday;
      const todayStr = formatDate(todaysDate);
      const statuses = ['not-started', 'complete', 'started', 'ignore'];
      const dom = {};
      let awoogaTimer;
    
      // ---Constructor Functions ---
      function Task(title, date, status, repeat, repeatId, assignedTo){
        this.title = title || 'New Task';
        this.date = date;
        this.status = status;
        this.repeat = repeat || 0;
        this.repeatId = repeatId || '';
        this.assignedTo = assignedTo || '';
        this.id = generateId();
        this.updatedAt = timeStamp();
        this.category = date || 'General';
      }
    
      //future for multiple task groups
      function TaskGroup(title, type, tasks, repeating, tags, id){
        this.title = title || 'New Task Group';
        this.type = type || 'taskList'; //toDoList
        this.tasks = tasks || [];
        this.repeating = repeating || [];
        this.tags = tags || [];
        this.id = id || generateId();
        this.updatedAt = timeStamp();
      }
    
      // --- Helper Functions ---
      function saveTaskGroup() {
        currentTaskGroup.type = dom.taskGroupType.value
        saveAndRender();
      }
    
     function updateSidePanel(task) {
        currentTask = task;
        dom.panelTitle.value = task.title;
        dom.panelStatus.value = task.status;
        dom.panelRepeat.value = task.repeat;
        dom.panelCategory.value = task.category;
        dom.panelAssignedTo.value = task.assignedTo;
      }
    
      function updateTaskGroupRepeating(task){
        const repeatingTaskId = currentTaskGroup.repeating.findIndex(r => r.id === task.repeatId);
        const repeatingTask = currentTaskGroup.repeating[repeatingTaskId];
    
        if(repeatingTask){
          if(task.repeat>0){
            repeatingTask.title = task.title;
            repeatingTask.repeat = task.repeat; //update
          }else{
            currentTaskGroup.repeating.splice(repeatingTaskId, 1); //remove
          }
        }else{
          const id = generateId(); //add new
          task.repeatId = id;
          const taskClone =  { ...task};
          taskClone.id = id;
          taskClone.updatedAt = timeStamp();
          currentTaskGroup.repeating.push(taskClone);
        }
      }
    
      function saveTask(){
        if(currentTask){
          currentTask.title = dom.panelTitle.value;
          currentTask.status = dom.panelStatus.value;
          currentTask.repeat = Number(dom.panelRepeat.value);
          updateTaskGroupRepeating(currentTask);
          currentTask.category = dom.panelCategory.value;
          currentTask.assignedTo = dom.panelAssignedTo.value;
          currentTask.updatedAt = timeStamp();
          saveAndRender();
        }
      }
    
      function saveAndRender() {
        saveToLocalStorage();
        renderView();
      }
    
      function setCurrentTaskGroup(){
        let index = taskData.taskGroups.findIndex(n => n.id === taskData.currentTaskGroupId);
        if (index==-1) index=0;
        currentTaskGroup = taskData.taskGroups[index];
        taskData.currentTaskGroupId = currentTaskGroup.id; //double set
        dom.taskGroupType.value = currentTaskGroup.type;
        saveAndRender();
      }
    
      function changeTaskGroup(){
        taskData.currentTaskGroupId = dom.taskGroupSelect.value
        setCurrentTaskGroup();
      }
    
      function addTaskGroup() {
        const title = dom.addTaskGroupInput.value;
        const newTaskGroup = new TaskGroup(title);
        taskData.taskGroups.push(newTaskGroup);
        taskData.currentTaskGroupId = newTaskGroup.id;
        setCurrentTaskGroup();
        dom.addTaskGroupInput.value = '';
        saveAndRender();
      }
    
      function getDay(dateStr){
        const timestamp = Date.parse(dateStr);
        if(isNaN(timestamp) == false) {
          var date = new Date(dateStr);
          return date.getDay();
        }else{
          return 1; // Monday
        }
      }
    
      function setDisplayCompleteButton(){
        dom.displayCompleteButton.textContent = (taskData.isDisplayComplete)? 'Hide Complete':'Show Complete';
      }
    
      function toggleDisplayComplete(){
        taskData.isDisplayComplete = !taskData.isDisplayComplete;
        setDisplayCompleteButton();
        saveAndRender();
      }
    
      function setWeeklyDailyViewButton(){
        dom.weeklyDailyViewButton.textContent = (taskData.isWeekly)? 'Show Day':'Show Week';
      }
    
      function toggleWeeklyDailyViewComplete(){
        taskData.isWeekly = !taskData.isWeekly;
        setWeeklyDailyViewButton();
        saveAndRender();
      }
      
      function showHideAnimation(){
       if(designSvg.classList.contains('planit-hidden')){
         dom.showHideAnimationButton.textContent = 'Hide Animation';
         designSvg.classList.remove('planit-hidden');
       }else{
         dom.showHideAnimationButton.textContent = 'Show Animation';
         designSvg.classList.add('planit-hidden'); 
       }
      }
    
      // --- Render Functions ---
      function renderView() {
        if(currentTaskGroup.type === 'taskList'){
          renderTaskList();
        }else{
          renderToDoList();
        }
      }
    
      function renderToDoList() {
        dom.taskView.innerHTML = '';
        dom.dateSelect.innerHTML = '';
        populateListsDropdown();
        const toDoTaskCategories = [];
    
        // Sort by category
        currentTaskGroup.tasks.sort((a, b) => {
          return a.title.localeCompare(b.title); // A-Z by category
        });
    
        currentTaskGroup.tasks.forEach(task => {
          // Create header if needed
          const taskCategory = task.category.toLowerCase();
          if(!toDoTaskCategories.includes(taskCategory)){ //only unique
            const dayBlock = planitDivCreator(null, 'day-block');
            const header = planitDivCreator(task.category, 'day-header');
            const block = planitDivCreator(null, 'task-block task-list', taskCategory);
            block.dataset.id = task.category;
            dayBlock.appendChild(header);
            dayBlock.appendChild(block);
            dom.taskView.appendChild(dayBlock);
            toDoTaskCategories.push(taskCategory);
            //using dateselect for categories
            const option = document.createElement('option');
            option.text = task.category;
            option.value = task.category;
            dom.dateSelect.add(option);
          }
          // Create tasks
          const block = document.getElementById(taskCategory);
          if(block){
            const taskItem = createTaskItem(task);
            block.appendChild(taskItem);
          }
        })
        initializeSortable();
      }
    
      function renderTaskList() {
        dom.taskView.innerHTML = '';
        dom.dateSelect.innerHTML = '';
        populateListsDropdown();
        daysOfWeek = [];
        repeatOrder = [];
    
        //if(currentTaskGroup.type === 'taskList'){
        if(taskData.isWeekly){
          for(let i=0; i<7; i++) {
            const day = new Date(currentMonday);
            day.setDate(day.getDate() + i);
            daysOfWeek.push(formatDate(day));
          }
        }else{
          daysOfWeek.push(formatDate(currentDay));
        }
    
        daysOfWeek.forEach(dayStr => {
          const day = new Date(dayStr);
          const dayTitle = day.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
          let header = planitDivCreator(dayTitle, 'day-header');
          const block = planitDivCreator(null, 'task-block task-list');
          block.dataset.id = dayStr; // also needed for drag-and-drop to know the date!
    
          const tasks = currentTaskGroup.tasks.filter(task => task.date === dayStr);
          tasks.forEach(task => {
            if(task.status!='complete' || taskData.isDisplayComplete){
              const taskItem = createTaskItem(task);
              block.appendChild(taskItem);
            }
            repeatOrder.push(task.repeatId);
          });
    
          const option = document.createElement('option');
          option.text = dayTitle;
          option.value = dayStr;
          option.selected = (dayStr===todayStr)? 'selected':'';
          dom.dateSelect.add(option);
    
          const dayBlock = planitDivCreator(null, 'day-block');
          dayBlock.appendChild(header);
          dayBlock.appendChild(block);
          dom.taskView.appendChild(dayBlock);
        })
        initializeSortable();
        updateWeeklyProgress();
      }
    
      function createTaskItem(task){
        const item = planitDivCreator(null, 'task-item ' + task.status);
        item.dataset.taskId = task.id;
    
        const repeat = planitDivCreator(null, 'task-repeat');
        const svgName = (task.repeat > 0)? 'repeat':'no-repeat';
        repeat.appendChild(createSvg(svgName, 'icon'));
        repeat.onclick = (e) => {
          e.stopPropagation();
          toggleRepeat(task, repeat);
        };
    
        const del = planitDivCreator(null, 'task-repeat');
        del.appendChild(createSvg('delete', 'icon'));
        del.onclick = (e) => {
          e.stopPropagation();
          deleteModal(task);
        };
    
        const status = planitDivCreator(null, 'task-status');
        status.appendChild(createSvg(task.status, 'icon'));
        status.onclick = () => toggleStatus(task);
    
        const title = planitDivCreator(task.title, 'task-title');
        title.contentEditable = 'true';
        title.onblur = () => updateTaskTitle(task, title);
    
        const handle = planitDivCreator(null, 'drag-handle')
        const handleSvg = createSvg('move', 'icon');
        handle.appendChild(handleSvg);
    
        item.appendChild(del);
        item.appendChild(repeat);
        item.appendChild(status);
        item.appendChild(title);
        item.appendChild(handle);
    
        return item;
      }
    
      function populateListsDropdown(){
        dom.taskGroupSelect.innerHTML = '';
        taskData.taskGroups.forEach(group => {
          const option = document.createElement("option");
          option.text = group.title;
          option.value = group.id;
          option.selected = (group.id === taskData.currentTaskGroupId)? 'selected':'';
          dom.taskGroupSelect.add(option);
        });
      }
    
      function feedback(toastMessage, emoji1, emoji2, animations){

        updateYouEmoji(emoji1);
        reflowAnimation(animations, true);
        setTimeout(() => {updateYouEmoji(emoji2); }, 1500);
      }
    
      // ---Task Item Change Properties ---
      function onComplete(task){
        //check all jobs finished for day
        const daysIncompleteTasks = currentTaskGroup.tasks.filter(t => t.date === task.date && t.status !== 'complete' && t.status  !== 'ignore');
        if(daysIncompleteTasks.length===0){
          feedback('Good job all jobs for day finished!', '🌟️', '🏆️️', 'wave,moveCenter,moveLeft,moveRight,moveLeft,moveCenter,bubbleEmoji');
        }else{
          feedback('Good job!', '👍️', '🧰️️', 'handsInTheAir,moveLeft,moveRight,moveCenter,wave');
        }
      }
    
      function startAwoogaIdleLoop() {
       clearTimeout(awoogaTimer);
        const idleAnimations = ['wave','hello','headRock','headBob','restPosition','armsLow','blink','eyeScan','raiseEyes','moveLeft','moveRight','flying','flyingFlapUp','flyingFlapDown'];
        async function triggerRandomAnimation() {
          // Random idle animation choice
          const action = idleAnimations[Math.floor(Math.random() * idleAnimations.length)];
          // Trigger it if it exists
          if (awoogaAnimations[action]) {
            if(!animationSequence.isRunning){
              reflowAnimation(action + ',restPosition');
            }else{
              //console.log('action running');
            }
          }else{
            //console.log('action not found:', action);
          }
          // Schedule the next animation after a random delay (e.g. 3 to 14 seconds)
          const nextDelay = 3000 + Math.random() * 11000;
          awoogaTimer = setTimeout(triggerRandomAnimation, nextDelay);
        }
        // Kick it off
        triggerRandomAnimation();
      }
    
      function toggleStatus(task) {
        const currentIndex = statuses.indexOf(task.status);
        const nextIndex = (currentIndex + 1) % statuses.length;
        task.status = statuses[nextIndex];
        if(task.status === 'complete'){
          onComplete(task);
        }else{
          reflowAnimation('restPosition,headBob,restPosition');
        }
        taskData.updatedAt = timeStamp();
        updateSidePanel(task);
        saveAndRender();
      }
    
      function toggleRepeat(task) {
        //task.repeat = (task.repeat>0)? 0:7;
        //saveAndRender();
        updateSidePanel(task);
        //updateTaskGroupRepeating
      }
    
      function deleteTask(task) {
        showToast(`task: ${task.title} deleted`, 'success');
        currentTaskGroup.tasks = currentTaskGroup.tasks.filter(t => !(t.id === task.id));
        task.updatedAt = timeStamp();
        closeModal();
        saveAndRender();
      }

      function checkDateRepeatMatch(dateStr1, dateStr2, repeatInDays){
        const oneDay = 24 * 60 * 60 * 1000; // hours*minutes*seconds*milliseconds
        const firstDate = new Date(dateStr1);
        const secondDate = new Date(dateStr2);
        const days =  Math.round(Math.abs((firstDate - secondDate) / oneDay));
        return days % repeatInDays === 0
      }
    
      function copyRepeats(){
        const daysOfWeekLen = daysOfWeek.length;
        currentTaskGroup.repeating.forEach(repeatingTask =>{
        for(let i=0; i<daysOfWeekLen; i++){
          const dateToCheck = daysOfWeek[i];
          const match = checkDateRepeatMatch(repeatingTask.date, dateToCheck, repeatingTask.repeat);
          if(match){
            //do not overwrite if the repeat has been applied to week
            if(!currentTaskGroup.tasks.find(check => check.repeatId === repeatingTask.id && check.date === dateToCheck)){
              currentTaskGroup.tasks.push(new Task(repeatingTask.title, dateToCheck, 'not-started', repeatingTask.repeat, repeatingTask.id, repeatingTask.assignedTo));
            }
            break;
          }
        }
        })
        saveAndRender();
      }

      function initializeSortable() {
        document.querySelectorAll('.task-list').forEach(listEl => {
          new Sortable(listEl, {
            group: 'shared-tasks',
            handle: '.drag-handle',
            onEnd: function (evt){
              const taskId = evt.item.dataset.taskId;
              const propToFilter = (currentTaskGroup.type === 'taskList')? 'date':'category';
              const arrayOfDomItems = evt.to.querySelectorAll('.task-item'); // List of current dom positions
    
              const newList = [];
              arrayOfDomItems.forEach(item => {
                if(item.dataset.taskId) newList.push(item.dataset.taskId);
              });
    
              const domIndex =  newList.indexOf(taskId);
              const itemAboveId = newList[domIndex-1];
              const itemBelowId  = newList[domIndex+1];
    
              const itemIndex = currentTaskGroup.tasks.findIndex(t => t.id === taskId);
              const itemClone = { ...currentTaskGroup.tasks[itemIndex]};
              // Update date or category if moved to different container
              if(evt.from.dataset.id !== evt.to.dataset.id){
                itemClone[propToFilter] = evt.to.dataset.id;
              }
              if(itemAboveId){
                let itemAboveIndex = currentTaskGroup.tasks.findIndex(t => t.id === itemAboveId);
                currentTaskGroup.tasks.splice(itemIndex, 1); //remove
                currentTaskGroup.tasks.splice(itemAboveIndex + 1, 0, itemClone); //insert clone below above item
              }else if(itemBelowId){
                let itemBelowIndex = currentTaskGroup.tasks.findIndex(t => t.id === itemBelowId);
                currentTaskGroup.tasks.splice(itemIndex, 1); //remove
                itemBelowIndex = (itemBelowIndex-1<0)? 0:itemBelowIndex; //fix for very first as -1 will place second from last
                currentTaskGroup.tasks.splice(itemBelowIndex - 1, 0, itemClone); //insert clone above below item
              }
              saveAndRender();
              sortRepeating();
            }
          })
          })
      }

      const timer = {value:0, interval:null, remainingTime:0, isPaused:false, minutes:0, song:[], songIndex:0};
    
      function rotateAroundPoint(centerOfRotation, degrees, radius){
          var xRot = centerOfRotation.x + (Math.cos(Math.PI/180 * degrees)*radius);
          var yRot = centerOfRotation.y + (Math.sin(Math.PI/180 * degrees)*radius);
          return {x:xRot,y:yRot};
      }
    
      function updateAngle(percent){
        if (isNaN(percent)) return;
        const centerPoint = {x:60, y:60};
        const startAngle = -90;
        const endAngle = ((percent/100) * 359)-90;
        const largeArcFlag = (endAngle > 90)? 1:0;
        const start = rotateAroundPoint(centerPoint, startAngle, 50);
        const end = rotateAroundPoint(centerPoint, endAngle, 50);
        dom.timerCircleSvg.setAttribute('d', `M${start.x} ${start.y} A 50 50 0 ${largeArcFlag} 1 ${end.x} ${end.y}`);
      }
    
      function setTimer(minuteValue){
        if(minuteValue){
          timer.value += minuteValue;
          timerDisplay.textContent = timer.value + ':00';

          timer.minutes = 0;

          timerDisplay.textContent = '00:00';
          stopTimer();
        }
      }
    
      function updateDisplay(isUpdateAngle) {
        
        if(isUpdateAngle){
          const percentCalc = 100- Number((timer.remainingTime/(timer.minutes*60)) * 100);
          updateAngle(percentCalc);
        }
        
        const mins = Math.floor(timer.remainingTime / 60);
        const secs = timer.remainingTime % 60;
        timerDisplay.textContent = `${String(Math.abs(mins)).padStart(2, '0')}:${String(Math.abs(secs)).padStart(2, '0')}`;
      }
    
      function startTimer() {
        let alarmPlayed = false;
        if (!timer.isPaused) {
          timer.minutes = parseInt(timer.value) || 10;
          timer.remainingTime = timer.minutes * 60;
        }
        timer.isPaused = false;
        clearInterval(timer.interval);
        timer.interval = setInterval(() => {
          
          const isUpdateAngle = (timer.remainingTime < 0)? false:true;
          timer.remainingTime--;
          updateDisplay(isUpdateAngle);
          
          if (timer.remainingTime < 0 && !alarmPlayed) {
            alarmPlayed = true;
            play();
            showToast(`Time's up! Nice work 🌟`, 'success');

      // Create the AudioContext once (outside the function)
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
    
      function playChord(notes, duration = 1) {
        const now = ctx.currentTime;
    
        // Master filter to smooth harshness
        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(2200, now);
        filter.connect(ctx.destination);
    
        notes.forEach((note, i) => {
          const freq = noteList[note]; // look up from your dictionary
          if (!freq) return;
    
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
    
          // Waveform (triangle is warmer than sine/saw)
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now);
    
          // Slight detune (±5 cents)
          osc.detune.value = (Math.random() - 0.5) * 10;
    
          // Envelope
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.8, now + 0.02); // fast attack
          gain.gain.linearRampToValueAtTime(0, now + duration); // fade out
    
          // Routing
          osc.connect(gain);
          gain.connect(filter);
    
          // Stagger start times for strum feel (10 ms apart)
          const delay = i * 0.01;
          osc.start(now + delay);
          osc.stop(now + duration + 0.1);
        });
      }

      function updateWeeklyProgress() {
        const weekStart = new Date(currentMonday);
        const dates = [];
    
        // Build date list for the week
        for (let i = 0; i < 7; i++) {
        const date = new Date(weekStart);
        date.setDate(weekStart.getDate() + i);
        const dateStr = formatDate(date);
        dates.push(dateStr);
        }
        // Count total and completed tasks
        let total = 0;
        let complete = 0;
        let started = 0;
    
        dates.forEach(dater => {
        const tasks = currentTaskGroup.tasks.filter(t => t.date === dater && t.status !== 'ignore') || [];
        total += tasks.length;
        complete += tasks.filter(t => t.status === 'complete').length;
        started += tasks.filter(t => t.status === 'started').length;
        });
        const percent = total > 0 ? Math.round((complete / total) * 100) : 0;
        const startedPercent = total > 0 ? Math.round((started / total) * 100) : 0;
        if (dom.fill) dom.fill.style.width = percent + "%";
        if (dom.startedFill) dom.startedFill.style.width = startedPercent + "%";
        if (dom.text) dom.text.textContent = `${complete} of ${total} tasks complete  ${percent}% ${started} started`;
        if (percent === 100) triggerConfetti();
    }

(function () {
  // Card logic for shopit
  const init = function() {
(function () {
      'use strict';
    
      // --- Global Declarations ---
      let shopData = {shopLists:[], viewType:'edit', updatedAt:0, currentShopListId:'', card:'shopit'};
      let currentShopList = [];
      let currentShopListProper;
      let currentShopItemId;
      let menuPlanData = [];
      let uniqueIngredients = [];
      let currentMonday = getMonday(new Date());
      const dom = {};
    
      // --- Constructor ---
      function ShopList(title, itemList, categories, id) {
        this.title = title;
        this.itemList = itemList || [];
        this.categories = [];
        this.id = id || generateId(); //planit.js
        this.updatedAt = timeStamp();
      }
    
      function ShopItem(title, category, order, tags, emoji, id) {
        this.title = title;
        this.category = category || '';
        this.order = order || false;
        this.tags = tags || [];
        this.emoji = emoji || getBestGuessEmoji(title, '🌿️');
        this.id = id || generateId(); //planit.js
        this.updatedAt = timeStamp();
      }
    
      // --- Helper Functions ---
      function updateListCategories(){
        const categories = parseTags(dom.categoryInput.value);
        currentShopListProper.categories = categories;
        saveToLocalStorage();
      }
    
      function clearFilter(){
        dom.filterItemsInput.value = '';
        saveAndRender();
      }
    
      function setCurrentShopList(){
        let index = shopData.shopLists.findIndex(n => n.id === shopData.currentShopListId);
        if (index==-1) index=0;
        currentShopList = shopData.shopLists[index].itemList;
        currentShopListProper = shopData.shopLists[index];
        saveToLocalStorage;
      }
    
      function saveAndRender() {
        saveToLocalStorage();
        renderView();
      }
    
      function setItemInput(str){
         dom.itemInput.value = str;
         dom.matchDisplay.innerHTML = '';
      }
    
      // --- Emoji Functions ---
      // getEmoji() and  removeTrailingS() in planit.js
      // Looks for matches, splits into words to handle multiple, looks for singular by removing trailing 's'
      function findEmoji() {
       const text = dom.filterInput.value.toLowerCase();
       const emojiList = [];
       if(text.length>1){
         const textList = text.split(' ');
         textList.forEach(textStr => {
          const textSigular = removeTrailingS(textStr);
          const filteredDataSet = emojiSet.filter(e => e.k.includes(textStr) || e.d.includes(textStr) || e.k.includes(textSigular) || e.d.includes(textSigular));
          filteredDataSet.forEach(emoji => {
          emojiList.push(emoji.e);
          })
        })
        populateEmojiBank(emojiList);
        }
      }
    
       function populateEmojiBank(emojis){
        emojiBank.innerHTML = '';
        emojis.forEach(emoji => {
          const button = document.createElement('button');
          button.className = 'emoji-button';
          button.textContent = emoji;
          button.onclick = () =>  dom.panelEmoji.value = emoji;
          emojiBank.appendChild(button)
        });
      }
    
      function useTitle() {
        dom.filterInput.value = dom.panelTitle.value.toLowerCase();
        findEmoji();
      }
    
      function updateSidePanel(data) {
        currentShopItemId = data.id;
        dom.panelTitle.value = data.title;
        dom.categorySelect.value = data.category;
        dom.panelOrder.checked = data.order;
        dom.panelEmoji.value = data.emoji;
        dom.panelTags.value = stringifyTags(data.tags);
      }
    
      function clearSidePanel() {
        updateSidePanel(new ShopItem('', '', false, [], null));
        currentShopItemId = null;
      }
    
      function getPanelData() {
        return new ShopItem(
            dom.panelTitle.value,
            dom.categorySelect.value,
            dom.panelOrder.checked,
            parseTags(dom.panelTags.value),
            dom.panelEmoji.value
          );
      }
    
      function saveShopItem() {
        const panelData = getPanelData();
        if (currentShopItemId) {
          const existing = currentShopList.find(t => t.id === currentShopItemId);
          Object.assign(existing, panelData);
        } else {
          currentShopList.push(panelData);
        }
        saveAndRender();
      }
    
      function deleteShopItem() {
        const itemIndex = currentShopList.findIndex(i => i.id === currentShopItemId);
        if(itemIndex!=-1){
          currentShopList.splice(itemIndex, 1);
        }
        saveAndRender();
      }
    
      function deleteList() {
        const listIndex = shopData.shopLists.findIndex(i => i.id === shopData.currentShopListId);
        shopData.shopLists.splice(listIndex, 1);
        shopData.currentShopListId = shopData.shopLists[0].id;
        setCurrentShopList();
        saveAndRender();
      }
    
      function sortItems(a, b) {
        if(!a.category) a.category = '';
        if(!b.category) b.category = '';
        if (a.category !== b.category) return a.category.localeCompare(b.category);
        return a.title.localeCompare(b.title);
      }
    
      function addItem() { //from top
        let title = dom.itemInput.value.trim();
        if(!title){title="New item";}
        currentShopList.push(new ShopItem(title, '', false));
        dom.itemInput.value = '';
        dom.matchDisplay.innerHTML = '';
        saveAndRender();
      }
    
      function addList() {
        const listTitle = (dom.listInput.value)? dom.listInput.value:'New List';
        const id = generateId();
        shopData.shopLists.push(new ShopList(listTitle, null, null, id));
        shopData.currentShopListId = id;
        setCurrentShopList();
        dom.listInput.value = '';
        saveAndRender();
      }
    
      function getMismatchedItems(arr1, arr2) {
        const mismatches = [];
        arr1.forEach(item => {
          const original = item;
          //const itemWithouEs = item.replace(/\b(\w+?)(es|s)?\b/,'')
          item = item.replace(/s\b/, '');
          if (!arr2.includes(item)  && !arr2.includes(item + 's') ) { /* && !arr2.includes(itemWithouEs) */
            mismatches.push(original);
          }
        });
        return mismatches;
      }
      // --- Menuit Integration ---
      const stopList = ['and', 'with', 'on', 'fried', 'french','plain','rolls'];
      function loadMenuDataFromStorage() {
        const dateList = [];
        const day = new Date(currentMonday);
        for(var i=0; i<7; i++){
          dateList.push(formatDate(day));
          day.setDate(day.getDate() + 1);
        }
        if (window.getPlanitSection) {
        const planitMenuData = getPlanitSection("menuit");
          if (planitMenuData.menuPlan) {
            try {
              menuPlanData = []; //clear
              uniqueIngredients = [];
              menuItemsData = planitMenuData.menuItems;
              planitMenuData.menuPlan.forEach(item => {
                if(dateList.includes(item.date)){
                  const titleText = item.title.toLowerCase()
                  if(!menuPlanData.includes(titleText)){
                    //find where title matches in plan and item data
                    const menuItem = menuItemsData.find(m => m.title === item.title);
                    if (menuItem) {
                     //get key ingredients and title words
                     const arr = titleText.split(" ").concat(menuItem.keyIngredients);
                     arr.forEach(ingredient => {
                       if(!uniqueIngredients.includes(ingredient) && !stopList.includes(ingredient)){
                        uniqueIngredients.push(ingredient)
                       }
                     });
                    }
                    menuPlanData.push(titleText)
                   }
                  }
              });
              menuPlanData.sort();
              uniqueIngredients.sort();
              const menuList = document.getElementById('menuList');
              menuList.innerHTML = uniqueIngredients.join(' ');
              titleArray = currentShopList.map(item => item.title.toLowerCase());
              document.getElementById('noMatchList').innerHTML = getMismatchedItems(uniqueIngredients, titleArray);
            } catch (e) {
              menuPlanData = [];
            }
          }else{
            menuPlanData = [];
          }
        }
      }
    /*
      function toggleSidePanel(){
        shopData.isPanelOpen = !shopData.isPanelOpen;
        saveToLocalStorage();
        setSidePanel(shopData.isPanelOpen);
      }
    */
      // --- Render Functions ---
      function renderView(renderType) {
        //currentShopList.shift();
        //const constNotCaptured = [];
        const list = dom.editView;
        const filterValue = dom.filterItemsInput.value.toLowerCase();
        list.innerHTML = '';
        orderList.innerHTML = '';
    
    
        for (let item of currentShopList.sort(sortItems)) {
          if(filterValue.length===0 ||  item.title.toLowerCase().startsWith(filterValue)){
            let altClass = '';
            if(renderType=='highlight' || renderType=='order'){
            const titleText = item.title.toLowerCase().replace(/s\b/, '');
              if(uniqueIngredients.includes(titleText) || uniqueIngredients.includes(titleText + 's')){
                 if(renderType=='highlight') altClass = " suggested";
                 if(renderType=='order') item.order = true;
              }
            }
            const className = 'item ' + (item.order? 'order-yes' : 'order-no');
            const div = planitDivCreator(null, className);
    
            div.onclick = () => updateSidePanel(item);
    
            const toggleContainer = planitDivCreator(null, 'item-order-button');
    
            const orderButton = document.createElement('button');
            orderButton.className = `order-button ${getCategoryClass(item.category)}`;
            orderButton.textContent = (item.order)? '✓':'+';
            orderButton.onclick = () => {
              item.order = !item.order;
              saveToLocalStorage();
              renderView();
            };
            div.appendChild(orderButton);
    
            if(!item.emoji) item.emoji = getBestGuessEmoji(item.title, '🌿️');
            const emojiDiv = planitDivCreator(item.emoji, 'emoji-text')
            div.appendChild(emojiDiv);
    
            const itemTitle = planitDivCreator(item.title, 'item-title')
            itemTitle.contentEditable = true;
            itemTitle.onblur = () => {
              item.title = itemTitle.textContent.trim();
              saveAndRender();
            };
    
            div.appendChild(itemTitle);
            list.appendChild(div);
    
            if(item.order){
              const orderTitle = planitDivCreator(item.emoji + ' ' + item.title, null);
              orderList.appendChild(orderTitle);
            }
          }
        }
       populateListsDropdown();
       populateCategorySelect();
       //saveToLocalStorage();
      }
    
      function getCategoryClass(categoryName){
        let index = currentShopListProper.categories.indexOf(categoryName) + 8;
        index = index % currentShopListProper.categories.length;
        return `cat-${index}`
      }
    
      function populateCategorySelect(){
        dom.categoryInput.value = stringifyTags(currentShopListProper.categories);
        dom.categorySelect.innerHTML = '';
        currentShopListProper.categories.forEach(category => {
          const option = document.createElement("option");
          option.text = category;
          option.value = category;
          //option.selected = (category === shopData.currentShopListId)? 'selected':'';
          dom.categorySelect.add(option);
        });
      }
    
      function populateListsDropdown(){
        dom.listSelect.innerHTML = '';
        shopData.shopLists.forEach(list => {
          const option = document.createElement("option");
          option.text = list.title;
          option.value = list.id;
          option.selected = (list.id === shopData.currentShopListId)? 'selected':'';
          dom.listSelect.add(option);
        });
      }
    
      function changeList(){
        shopData.currentShopListId = dom.listSelect.value; 
        setCurrentShopList();
        saveAndRender();
      }
    
      function highlightItems(){
        renderView('highlight');
      }
    
      function orderItems(){
        renderView('order');
        saveToLocalStorage();
      }
    
    
     function setView(){
        if(shopData.viewType === 'list'){
          dom.editView.classList.add('planit-hidden');
          dom.listView.classList.remove('planit-hidden');
          dom.toggleViewButton.textContent = 'Edit View️';
          clearFilter(); //show all list items if filter is on;
        }else{
          dom.editView.classList.remove('planit-hidden');
          dom.listView.classList.add('planit-hidden');
          dom.toggleViewButton.textContent = 'List View️';
        }
      }
    
      function toggleView(){
        shopData.viewType = (shopData.viewType === 'list')? 'edit':'list';
        saveToLocalStorage();
        setView();
      }
    
       // --- Save and Load ---
      function loadFromStorage() { //!add items if empty
      if (window.getPlanitSection) {
      const planitShopData = getPlanitSection("shopit");
        if (planitShopData.shopLists) {
          try {
            shopData = planitShopData;
            setCurrentShopList();
          } catch (e) {
            console.warn("Could not parse saved tasks:", e);
          }
          }else{
            shopData.updatedAt = timeStamp();
            const itemList = [
              new ShopItem('Butter', 'dairy', true),
              new ShopItem('Carrots', 'fruit-vegetables', true),
              new ShopItem('Onions', 'fruit-vegetables', true),
              new ShopItem('Soap', 'items', false)
            ];
            const starterList = new ShopList('supermarket', itemList, ['fruit-vegetables','pantry','dairy','freezer','meat-fish-poultry','items']);
            shopData.currentShopListId = starterList.id;
            dom.listSelect.value = starterList.id;
            shopData.shopLists.push(starterList);
            currentShopListProper = starterList;
            const hardwareList = new ShopList('hardware', [new ShopItem('Screws', 'items', false)], []);
            shopData.shopLists.push(hardwareList);
            changeList();
          }
        }
      }
    
      function saveToLocalStorage() {
        if (window.updatePlanitSection) {
          updatePlanitSection("shopit", shopData);
        }
      }
    
      // --- Import and Export ---
      function exportData() {
        exportCardData(shopData, 'shopit'); //planit.js
      }
    
      function importData(event) {
        const file = event.target.files[0];
        if(file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            shopData = JSON.parse(e.target.result);
            saveAndRender();
          };
          reader.readAsText(file);
        }
      }
    
      // --- Initialization ---
      function initDomReferences() {
        dom.panelTitle = document.getElementById('title');
        dom.panelOrder = document.getElementById('order');
        dom.panelTags = document.getElementById('tags');
        dom.panelEmoji = document.getElementById('emoji');
        dom.itemInput = document.getElementById('itemInput');
        dom.matchDisplay = document.getElementById('matchDisplay');
        dom.listInput = document.getElementById('listInput');
        dom.categorySelect = document.getElementById('categorySelect');
        dom.categoryInput = document.getElementById('categoryInput');
        dom.categoryInput?.addEventListener('input', updateListCategories);
        dom.categoryInput?.addEventListener('blur', renderView);
        dom.listSelect = document.getElementById('listSelect');
        dom.listSelect?.addEventListener('change', changeList);
        dom.filterInput = document.getElementById('filterInput');
        dom.filterInput?.addEventListener('input', findEmoji);
        dom.emojiBank = document.getElementById('emojiBank');
        dom.editView = document.getElementById('editView');
        dom.listView = document.getElementById('listView');
        dom.filterItemsInput = document.getElementById('filterItemsInput');
        dom.filterItemsInput?.addEventListener('input', renderView);
    
        //Display matches on input
        dom.itemInput.addEventListener('input', () => {
          const query = dom.itemInput.value.trim().toLowerCase();
          dom.matchDisplay.innerHTML = ''; // Clear previous matches
          if (query.length === 0) return;
          const matches = currentShopList.filter(item => item.title.toLowerCase().startsWith(query)); //.includes(query));
          if (matches.length > 0) {
            const autoSuggestContainer = planitDivCreator(null, 'autoselect-container');
            matches.forEach(match =>{

                matchDiv.onclick = () => setItemInput(match.title);

          }

      function initButtons() {

        importDataButton?.addEventListener("click", () => hiddenFileInput?.click());
        hiddenFileInput?.addEventListener("change", importData);
