          const eventTitle = planitDivCreator(event.title, 'event-title');
          const eventTime = planitDivCreator(event.startTime, 'event-time');
    
          eventContainer.appendChild(eventDate);
          eventContainer.appendChild(eventTitle);
          eventContainer.appendChild(eventTime);
          dom.ganttViewTwo.appendChild(eventContainer)
        });
    
    
    
    
    
    
    
      }
    
    
    
    
    
      // --- Save and Load ---
      function loadFromLocalStorage() {
        if (window.getPlanitSection) {
          const saved = getPlanitSection("eventit"); //planit.js
          if (saved?.events) {
            try {
              eventData = saved;
              eventData.card = 'eventit';
              saveToLocalStorage();
            } catch (e) {
              console.warn("Could not parse saved eventit data:", e);
              eventData = [];
            }
          } else {
            eventData.events = [
              new EventItem('Doctors Appointment'),
              new EventItem('Visit Dad')
            ];
            saveToLocalStorage();
          }
        }
      }
    
      function saveToLocalStorage() {
        if (window.updatePlanitSection) {
          updatePlanitSection("eventit", eventData); //planit.js
        }
      }
    
      // --- Import and Export ---
      function exportData() {
        exportCardData(eventData, 'eventit'); //planit.js
      }
    
      function importData(event) {
        const file = event.target.files[0];
        if(file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            eventData = JSON.parse(e.target.result);
            saveAndRender();
          };
          reader.readAsText(file);
        }
      }
    
      // --- Initialization ---
      function initDomReferences() {
        dom.eventView = document.getElementById('eventView');
        dom.sidePanel = document.getElementById('sidePanel');
        dom.titleInput = document.getElementById('titleInput');
    
        dom.panelTitle = document.getElementById('title');
        dom.panelType = document.getElementById('type');
        dom.panelStartDate = document.getElementById('startDate');
        dom.panelEndDate = document.getElementById('endDate');
        dom.panelStartTime = document.getElementById('startTime');
        dom.panelEndTime = document.getElementById('endTime');
        dom.panelPurpose = document.getElementById('purpose');
        dom.panelStatus = document.getElementById('status');
        dom.panelRepeat = document.getElementById('repeat');
        dom.panelRepeatEndDate = document.getElementById('repeatEndDate');
        dom.panelTags = document.getElementById('tags');
    
        //autopanel
        dom.panelTitle?.addEventListener('input', saveItem);
        dom.panelType?.addEventListener('input', saveItem);
        dom.panelStartDate?.addEventListener('input', saveItem);
        dom.panelEndDate?.addEventListener('input', saveItem);
        dom.panelStartTime?.addEventListener('input', saveItem);
        dom.panelEndTime?.addEventListener('input', saveItem);
        dom.panelPurpose?.addEventListener('change', saveItem);
        dom.panelStatus?.addEventListener('change', saveItem);
        dom.panelRepeat?.addEventListener('input', saveItem);
        dom.panelRepeatEndDate?.addEventListener('input', saveItem);
        dom.panelTags?.addEventListener('input', saveItem);
    
        dom.gantt = document.getElementById('ganttView');
        dom.ganttViewTwo = document.getElementById('ganttViewTwo');
      }
    
      function initButtons() {

        document.getElementById('deleteItem')?.addEventListener('click', deleteItem);
    
        //Import Export Json Data
        document.getElementById('exportDataButton')?.addEventListener('click', exportData);

        if(itemTimeFrame===cellTimeFrame){
          totals[type][cellTimeFrame] += amount;
          return dollarString(amount);
        }
    
        //convert to days
        if(itemTimeFrame=='weekly'){
          dayAmount = amount/7;
        }else if(itemTimeFrame=='monthly'){
          dayAmount = amount/monthFactor;
        }else if(itemTimeFrame=='annually'){
          dayAmount = amount/365;
        }
    
        //multiply days by
        if(cellTimeFrame=='weekly'){
          totals[type][cellTimeFrame] += (dayAmount * 7);
          return dollarString(dayAmount * 7);
        }else if(cellTimeFrame=='monthly'){
          totals[type][cellTimeFrame] += (dayAmount * monthFactor);
          return dollarString(dayAmount * monthFactor);
        }else if(cellTimeFrame=='annually'){
          totals[type][cellTimeFrame] += (dayAmount * 365);
          return dollarString(dayAmount * 365);
        }
      }
    
      // --- Render Functions ---
      function renderView() {
        const typeOrder = ['savings','incoming','outgoing']
        const totals = {...totalsOriginal};
        dom.fundView.innerHTML = '';
    
        if (fundData.funds.length === 0) {
          dom.fundView.innerHTML = '<div class="no-items">Nothing to fund!</div>';
          return;
        }
    
        fundData.funds.sort((a, b) => {
          //if (a.funding !== b.funding) {
            //return a.funding ? -1 : 1; // true comes before false
          //}
          return typeOrder.indexOf(a.type) - typeOrder.indexOf(b.type); //sort by Mon,  Tues, etc.
          //return a.type.localeCompare(b.type); // A-Z by amount
        });
    
        const header = planitDivCreator(null, 'gen-item header-container');
        header.appendChild(planitDivCreator('Title', 'header-item'));
        header.appendChild(planitDivCreator('Type', 'header-item'));
        header.appendChild(planitDivCreator('Duration', 'header-item'));
        //header.appendChild(planitDivCreator('Day', 'header-item'));
        header.appendChild(planitDivCreator('Current', 'header-item fundit-amount'));
        header.appendChild(planitDivCreator('Weekly', 'header-item fundit-amount'));
        header.appendChild(planitDivCreator('Monthly', 'header-item fundit-amount'));
        header.appendChild(planitDivCreator('Annually', 'header-item fundit-amount'));
        dom.fundView.appendChild(header);
    
        fundData.funds.forEach(item => {
    
          //const div = document.createElement('div');
          const durationLowerCase = item.type.toLowerCase();
          const div = planitDivCreator(null, `gen-item fund-${durationLowerCase} fund-item`);
          div.dataset.id = item.id;
          div.onclick = () => updateSidePanel(item);
    
          const title = planitDivCreator(item.title, 'fundit-title');
          const type = planitDivCreator(item.type, 'fundit-type');
          const duration = planitDivCreator(item.duration, 'fundit-duration');
          //const day = planitDivCreator(item.day, 'fundit-day');
    
          const weekStyle = (item.duration==='weekly')? 'fundit-amount is-week':'fundit-amount';
          const monthStyle = (item.duration==='monthly')? 'fundit-amount is-month':'fundit-amount';
          const annualStyle = (item.duration==='annually')? 'fundit-amount is-annual':'fundit-amount';
    
          const amountCurrent= planitDivCreator('-', 'fundit-amount'); //default
          if(item.duration==='current'){
            totals.savings.current += Number(item.amount);
            amountCurrent.textContent = dollarString(item.amount);
            amountCurrent.className = 'fundit-amount is-annual';
          }
    
          const amountWeek = planitDivCreator(calculateAmount(item.amount, item.duration, 'weekly', totals, item.type), weekStyle);
          const amountMonth = planitDivCreator(calculateAmount(item.amount, item.duration, 'monthly', totals, item.type), monthStyle);
          const amountAnnual = planitDivCreator(calculateAmount(item.amount, item.duration, 'annually', totals, item.type), annualStyle);
    
          div.appendChild(title);
          div.appendChild(type);
          div.appendChild(duration);
          //div.appendChild(day);
          div.appendChild(amountCurrent);
          div.appendChild(amountWeek);
          div.appendChild(amountMonth);
          div.appendChild(amountAnnual);
    
          dom.fundView.appendChild(div);
        });
    
        const outgoingTotalContainer = planitDivCreator(null, 'gen-item fund-outgoing-totals');
        outgoingTotalContainer.appendChild(planitDivCreator('Total', 'fundit-title'));
        outgoingTotalContainer.appendChild(planitDivCreator('outgoing', 'fundit-type'));
        outgoingTotalContainer.appendChild(planitDivCreator('', 'fundit-duration'));
        outgoingTotalContainer.appendChild(planitDivCreator('-', 'fundit-amount'));
        outgoingTotalContainer.appendChild(planitDivCreator(dollarString(totals.outgoing.weekly), 'fundit-amount'));
        outgoingTotalContainer.appendChild(planitDivCreator(dollarString(totals.outgoing.monthly), 'fundit-amount'));
        outgoingTotalContainer.appendChild(planitDivCreator(dollarString(totals.outgoing.annually), 'fundit-amount'));
        dom.fundView.appendChild(outgoingTotalContainer);
      }
    
      // --- Save and Load ---
      function loadFromLocalStorage() {
        if (window.getPlanitSection) {
          const saved = getPlanitSection("fundit"); //planit.js
          if (saved?.funds) {
            try {
              fundData = saved;
              fundData.card = 'fundit';
              saveToLocalStorage();
            } catch (e) {
              console.warn("Could not parse saved fundit data:", e);
            }
          } else {
            fundData.funds = [
              new FundItem('Bank', 'savings', 'weekly', true, 'Monday', 22),
              new FundItem('Credit Card Fee', 'outgoing', 'monthly', false, 'Monday',33),
              new FundItem('Interest', 'incoming', 'annually', false, 'Monday',44)
            ];
            saveToLocalStorage();
          }
        }
      }
    
      function saveToLocalStorage() {

        }
      }
    
      // --- Import and Export ---
      function exportData() {

      }
    
      function importData(event) {
        const file = event.target.files[0];
        if(file) {

      // --- Initialization ---

        dom.panelType = document.getElementById('type');

        //dom.panelDay?.addEventListener('change', saveFundItem);

(function () {

      function toggleSidePanel(){

    */

        codeData.isDisplayCodeed = !codeData.isDisplayCodeed;

      }
    
      function updateSidePanel(data) {
        currentCodeItemId = data.id;
        dom.panelTitle.value = data.title;
        dom.panelCode.value = data.code;
        dom.panelCategory.value = data.category;
        dom.panelLanguage.value = data.language;
        dom.panelTags.value = stringifyTags(data.tags);

        updateSidePanel(new CodeItem('', '', '', false));

      function getPanelData() {
        return {
          title: dom.panelTitle.value,

          category: dom.panelCategory.value,
          language: dom.panelLanguage.value,
          tags: parseTags(dom.panelTags.value),
          updatedAt: timeStamp(),
        };
      }
    
      function saveCodeItem() {
        const panelData = getPanelData();
        if (currentCodeItemId) {
          const existing = codeData.code.find(s => s.id === currentCodeItemId);
          Object.assign(existing, panelData);
        } else {
          const newCode = new CodeItem(panelData.title); //for duplicate or copy
          currentCodeItemId = newCode.id;
          Object.assign(newCode, panelData);
          codeData.code.push(newCode);
        }
        saveAndRender();
        showToast(`${panelData.title} updated`, 'success');
      }
    
      function duplicateItem(){
        currentCodeItemId = null;
        saveCodeItem()
      }
    
      function startNew() {
        let newTitle = dom.titleInput.value.trim();
        if (!newTitle) newTitle = "New Snippet";
        const newItem = new CodeItem(newTitle);
        codeData.code.push(newItem);
        updateSidePanel(newItem);
        saveAndRender();
        showToast(`${newTitle} added`, 'success');
      }
    
      function deleteItem(){
        const index = codeData.code.findIndex(s => s.id===currentCodeItemId);
        if(index!=-1){
          codeData.code.splice(index, 1);
          showToast(`show deleted`, 'success');
        }
        currentCodeItemId = null;
        saveAndRender();
      }
    
      // --- Render Functions ---
      function renderView() {
        dom.codeView.innerHTML = '';
    
        if (codeData.code.length === 0) {
          dom.codeView.innerHTML = '<div class="no-items">Nothing to code!</div>';
          return;
        }
    
        codeData.code.sort((a, b) => {
          if (a.codeing !== b.codeing) {
            return a.codeing ? -1 : 1; // true comes before false
          }
          return languages.indexOf(a.language) - languages.indexOf(b.language); //sort by Mon,  Tues, etc.
          //return a.time.localeCompare(b.time); // A-Z by time
        });
    
        codeData.code.forEach(item => {

          }
        });

      function highlightCode(code) {
        //const pre = document.getElementById(preId);

        let html = code
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')

          .replace(/(\/\/.*)/g, '<span class="comment">$1</span>');
          // strings

          // numbers
          //.replace(/\b(\d+)\b/g, '<span class="number">$1</span>')

          //  /\b(function|let|var|const|if|else|for|while|return|class|new|this|throw|try|catch)\b/g,
          //  '<span class="keyword">$1</span>'

        return  html;

      function createFormElement(field){

          field.options.forEach(fieldOption => {
            const option = document.createElement('option');
            option.text = fieldOption;
            option.value = fieldOption;
            inputElement.add(option);
          });
          return inputElement;
        }else if(field.type==='textarea'){
          const inputElement = document.createElement('textarea');
          inputElement.placeholder = field.placeholder;
          inputElement.className = 'textarea';
          return inputElement;
        }else {
          const inputElement  = document.createElement('input');
          const fieldType = (field.type === 'tags')? 'text':field.type;
          inputElement.type = fieldType;
          inputElement.placeholder = field.placeholder;
          return inputElement;
        }
        return null;
      }

      function updateField(field, div, property){
        const value = (property==='type')? div.value:div.textContent;

         field.options = value.split(','); //turn into array
        }else if(value === 'day'){
          field.type = 'select';
          field.options = days;
        }else{
          field[property] = value;

          const elementContainer = planitDivCreator(null, 'field-element');

          fieldTitle.onblur = () => updateField(field, fieldTitle, 'title');
          placeholder.onblur = () => updateField(field, placeholder, 'placeholder');
          options.onblur = () => updateField(field, options, 'options');

          selectTypeContainer.appendChild(selectType);

      function renderLiveView(){
        dom.addNewItemInput.placeholder=`New item ${currentCard.fields[0].name}... `;

        const savedItems = currentCard.items;

        // Sorting
        if(!currentCard?.viewSort) updateColumnSort(); //transition remove
        
        const sortOrderOne = currentCard.viewSort.one;
        const sortOrderTwo = currentCard.viewSort.two;;
        
        const sortByOne = sortOrderOne.column;
        const sortByTwo = sortOrderTwo.column;
    
        
        // Helper: Get sort direction multiplier
        const getSortDirection = (dir) => dir === 'descending' ? -1 : 1;
    
        const dirOne = getSortDirection(sortOrderOne.direction);
        const dirTwo = getSortDirection(sortOrderTwo.direction);
        
               
        const sortByOneField = currentCard.fields.find(f => f.name === sortByOne);
        const sortByTwoField = currentCard.fields.find(f => f.name === sortByTwo);
        const sortByOneType = sortByOneField?.type;
        const sortByTwoType = sortByTwoField?.type;
        const sortByOneOptions = sortByOneField?.options;
        const sortByTwoOptions = sortByTwoField?.options;
        
        //select and days to be sorted by index of;
        //true and false not needed as yes or no text for checkbox;    
        currentCard.items.sort((a, b) => {
          //Fix data if data structure has changed;
          if(!a[sortByOne]) a[sortByOne] = '';
          if(!b[sortByOne]) b[sortByOne] = '';
          if (a[sortByOne] !== b[sortByOne]) {
            if(sortByOneType==='select' && sortByOneOptions){
              return sortByOneOptions.indexOf(a[sortByOne]) -sortByOneOptions.indexOf(b[sortByOne]); //sort by an array.
            }else{
              return a[sortByOne].localeCompare(b[sortByOne]) * dirOne; // A-Z sort        
              //return (indexA - indexB) * dirTwo;
            }
          }
              
          //Fix data if data structure has changed;
          if(!a[sortByTwo]) a[sortByTwo] = '';
          if(!b[sortByTwo]) b[sortByTwo] = '';
          
          if(sortByTwo==='select' && sortByTwoOptions){
            return sortByTwoOptions.indexOf(a[sortByTwo]) - sortByTwoOptions.indexOf(b[sortByTwo]); //sort by an array.
          }else{
            return a[sortByTwo].localeCompare(b[sortByTwo]) * dirTwo; // A-Z sort
          }
        });
        
        
    
        // Headers
        const headerContainer = planitDivCreator(null, 'gen-item planit-header');
        currentCard.fields.forEach(field => {
          headerContainer.appendChild(planitDivCreator(field.title, 'modit-item'));

            fieldContainer.appendChild(cell);
          });
          dom.liveContainer.appendChild(fieldContainer);
        });
      }

      function initDomReferences() {

  function updateTheme(themeName, variables) {
   for (const sheet of document.styleSheets) {
    try {
      for (const rule of sheet.cssRules) {
        if (rule.selectorText === `[data-theme="${themeName}"]`) {
          //console.log(rule.cssText)
          for (const [varName, value] of Object.entries(variables)) {
            rule.style.setProperty(varName, value);
          }
          return true;
        }
      }
    } catch (e) {
      console.warn("Stylesheet access error:", e);
    }
  }
  return false;
  }



  function addLettersOneByOne(text, delay) {
    let index = 0;
    clearTimeout(letterTimeout);
    function addNextLetter() {
      if (index < text.length) {
        const letter = text.charAt(index);
        dom.toast.textContent += letter;
        index++;
        let writeDelay = (letter===' ')? (delay*4):delay;
        //setTimeout(addNextLetter, writeDelay);
        letterTimeout = setTimeout(addNextLetter, writeDelay);
      }
    }
    addNextLetter();
  }

  function getLocalStorageSizeInMegabytes() {
    let total = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      const value = localStorage.getItem(key);
      total += key.length + value.length;
    }
    // Convert to bytes (UTF-16 uses 2 bytes per character) then Mb
    return ((total * 2) / (1024*1024)).toFixed(2);
  }

  function afterLoading(){

  const planitLocalStorageName = 'planitData'; //'planitData'
  const planitDbName = 'planit-db';
  const planitStoreName = 'planit-store';
  const planitKey = 'planit-main';

  async function loadPlanitData() {
    // 1. Try localStorage
    const local = localStorage.getItem(planitLocalStorageName);
    if (local) {
      try {
        const data = JSON.parse(local);
        Object.assign(planitData, data); // merge without losing reference
        afterLoading();
        console.log('loading local data');
        return data;
      } catch (e) {
        console.warn('LocalStorage data corrupted, falling back to IndexedDB');
      }
    }
    // 2. Fallback to IndexedDB
    const db = await openPlanitDB();
    const tx = db.transaction(planitStoreName, 'readonly');
    const store = tx.objectStore(planitStoreName);
    const request = store.get(planitKey);
    return new Promise((resolve) => {
      request.onsuccess = () => {
        const data = request.result || null;
        // Rehydrate localStorage if we found something
        if (data) {
          console.log('loading index db data');
          Object.assign(planitData, data);
          afterLoading();
          localStorage.setItem(planitLocalStorageName, JSON.stringify(data));
        }else{
         console.log('loading base data');
         afterLoading();
        }
        resolve(data);
      };
      request.onerror = () => resolve(null);
    });
  }

  function openPlanitDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(planitDbName, 1);
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        if (!db.objectStoreNames.contains(planitStoreName)) {
          db.createObjectStore(planitStoreName);
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function savePlanitData() {
    const json = JSON.stringify(planitData);
    // Fast path
    localStorage.setItem(planitLocalStorageName, json);
    // Durable path
    const db = await openPlanitDB();
    const tx = db.transaction(planitStoreName, 'readwrite');
    const store = tx.objectStore(planitStoreName);
    store.put(planitData, planitKey);
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }

  function exportCardData(data, cardName) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${cardName}-data-${formatDate()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importCardData(event, cardname, mainProperty) {
    return new Promise((resolve, reject) => {
      const file = event.target.files[0];
      if (!file) return reject('No file selected');
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if(data.card === cardname && data?.[mainProperty]){ //check not another card and contains main property e.g. shows for watchit
            resolve(data);
          }else{
            reject('Card name or structure does not match');
          }
        } catch (err) {
          reject('Error parsing JSON: ' + err);
        }
      };
      reader.onerror = () => reject('File read error');
      reader.readAsText(file);
    });
  }

  function getMonday(date) {
    const d = new Date(date);
    const day = d.getDay(), diff = d.getDate() - day + (day === 0 ? -6 : 1);
    return new Date(d.setDate(diff));
  }

  function formatDate(date) { //toLocalDateString
    date = date || new Date();
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function createSvg(iconName, className) {

    svg.className.baseVal = className;
    const use = document.createElementNS(svgns,'use');
    use.href.baseVal = `#${iconName}`;
    svg.appendChild(use);
    return svg;
  }

  // Converts input string to array of trimmed tags
  function parseTags(inputString) {
    if (typeof inputString !== 'string') return [];
    return inputString
      .split(',')
      .map(tag => tag.trim())
      .filter(tag => tag !== '');
  }

  // Converts tags array to comma-separated string
  function stringifyTags(tagsArray) {
    if (!Array.isArray(tagsArray)) return tagsArray || '';
    return tagsArray.join(', ');
  }
