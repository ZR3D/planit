// menuit.js
(function () {
  // Card logic for menuit
  const init = function() {
(function () {
      'use strict';
    
      // --- Global Declarations ---
      let currentMenuItemId = null;
      let currentMenuPlanId = null;
      let menuData = {menuPlan: [], viewType:'edit', menuItems: [], isPanelOpen:true, updatedAt:timeStamp(), card:'menuit'};
      let shopData = [];
      let recipeData = {};
      let currentMonday = getMonday(new Date());
      let currentDate = currentMonday;
      let currentFilter = '';
      const dom = {};
    
      // --- Constructors ---
      function MenuPlanItem(title, date, meal, repeat, order, id){
        this.title = title;
        this.date = date;
        this.meal = meal;
        this.repeat = repeat || false;
        this.order = order || 0;
        this.id = id || generateId();
        this.updatedAt = timeStamp();
      }
    
      function MenuItem(title, keyIngredients, tags, id){
        this.title = title;
        this.tags = tags || [];
        this.keyIngredients = keyIngredients || [];
        this.id = id || generateId();
        this.updatedAt = timeStamp();
      }
    
    
      // --- Helper Functions ---
      function saveAndRender() {
        saveToLocalStorage();
        renderView();
      }
    
      function renderView(){
        renderPlanner();
        renderMenuList();
      }
    
      function goToRecipe(recipeId){
        recipeData.currentRecipeId = recipeId;
        //save
        updatePlanitSection("recipeit", recipeData);
        //open page
        loadView('recipeit')
      }
    
    
      // Converts input string to array of trimmed tags
      function parseTags(inputString) {
        if (typeof inputString !== 'string') return [];
        return inputString
          .split(',')
          .map(tag => tag.trim())
          .filter(tag => tag !== '');
      }
    
      // Converts tags array to comma-separated string
      function stringifyTags(tagsArray) {
        if (!Array.isArray(tagsArray)) return tagsArray || '';
        return tagsArray.join(', ');
      }
    
      function updateSidePanelItem(data) {
        currentMenuItemId = data.id;
        dom.itemTitle.value = data.title;
        dom.itemKeyIngredients.value = stringifyTags(data.keyIngredients);
        dom.itemTags.value = stringifyTags(data.tags);
      }
    
      function getItemPanelData() {
        return new MenuItem(
          dom.itemTitle.value.trim(),
          parseTags(dom.itemKeyIngredients.value),
          parseTags(dom.itemTags.value),
          currentMenuItemId
          );
      }
    
      function saveMenuItem() {
        const panelData = getItemPanelData();
        if (currentMenuItemId) {
          const existing = menuData.menuItems.find(t => t.id === currentMenuItemId);
          Object.assign(existing, panelData);
        } else {
          menuData.menuItems.push(panelData);
        }
        saveAndRender();
      }
    
      function startNew(){
        let newTitle = dom.titleInput.value.trim();
        if (!newTitle) newTitle = "New Show";
        const newItem = new MenuItem(newTitle);
        menuData.menuItems.push(newItem);
        updateSidePanelItem(newItem);
        dom.titleInput.value = '';
        saveAndRender();
        showToast(`${newTitle} added`, 'success');
      }
    
      //--- Planner Updates ---
      function updateSidePanelPlan(data) {
        currentMenuPlanId = data.id;
        dom.planTitle.value = data.title;
        dom.planRepeat.checked = data.repeat;
      }
    
      function saveMenuPlan() {
        if(currentMenuPlanId) {
          const existing = menuData.menuPlan.find(t => t.id === currentMenuPlanId);
          existing.title = dom.planTitle.value;
          existing.repeat = dom.planRepeat.checked;
          existing.updatedAt = timeStamp();
        }
        saveAndRender();
      }
    
     function deleteMenuPlan() {
      if(currentMenuPlanId) {
        menuData.menuPlan = menuData.menuPlan.filter(t => !(t.id === currentMenuPlanId));
        currentMenuPlanId = null;
        showToast(`planner item: deleted`, 'success');
        saveAndRender();
      }
     }
    
     function addMenuItem() {
       currentMenuItemId = null;
       saveMenuItem();
     }
    
     function deleteMenuItem() {
        menuData.menuItems = menuData.menuItems.filter(t => !(t.id === currentMenuItemId));
        updateSidePanelItem(new MenuItem('', [], [], null));
        currentMenuItemId = null;
        showToast(`item: deleted`, 'success');
        saveAndRender();
     }
    
      function filterMenuList() {
        const term = dom.filterInput.value.trim();
        renderMenuList(term);
      }
    
      function filterByTag(tag) {
        renderMenuList(tag);
      }
    
      function prevWeek() {
        currentDate.setDate(currentDate.getDate() - 7);
        renderPlanner();
      }
    
      function nextWeek() {
        currentDate.setDate(currentDate.getDate() + 7);
        renderPlanner();
      }
    
      function copyRepeats() {
        const newWeek = [];
        const lastWeekStart = new Date(currentMonday);
        lastWeekStart.setDate(lastWeekStart.getDate() - 7);
        for (let i = 0; i < 7; i++) {
          const date = new Date(lastWeekStart);
          date.setDate(date.getDate() + i);
          const dateStr = formatDate(date);
          const nextDate = new Date(currentMonday);

      function normalizeQuantity(ingredient) {
        const lower = ingredient.toLowerCase().trim();
    
        // 1. Handle multipliers like '7 x 60g'
        const multiplierMatch = lower.match(/(\d+)\s*[x×*]\s*(\d+\.?\d*)\s*([a-z]+)/i);
        if (multiplierMatch) {
          const count = parseFloat(multiplierMatch[1]);
          const amount = parseFloat(multiplierMatch[2]);
          const unit = multiplierMatch[3];
          const total = count * amount;
          const rest = ingredient.slice(multiplierMatch[0].length).trim();
          return `${total}${unit} ${rest}`;
        }
    
        // 2. Handle ranges like '5 - 6', '0.25 to 0.5'
        const rangeMatch = ingredient.match(/(\d*\.?\d+)\s*(?:To|to|-)\s*(\d*\.?\d+)/);
        if (rangeMatch) {
          const start = parseFloat(rangeMatch[1]);
          const end = parseFloat(rangeMatch[2]);
          const avg = (start + end) / 2;
          const rest = ingredient.replace(rangeMatch[0], '').trim();
          return `${avg} ${rest}`;
        }
    
        // 3. Return unchanged if no match
        return ingredient;
      }
    
      // --- Ingredients ---
      function standardiseUnits(unit) {
        // capitalisation required for teaspoon units, otherwise case insensitive
        if(unit==='T' || unit==='Ts'){
         unit = 'tbsp';
        }
        const map = {
          // tablespoons
          'tablespoon':'tbsp', 'tablespoons':'tbsp', 'tbs':'tbsp',
          // teaspoons
          'teaspoon': 'tsp', 'teaspoons': 'tsp','t':'tsp','ts':'tsp','tspn':'tsp',
          // kilograms
          'kg':'kilogram', 'kgs':'kilograms', 'kilo':'kilogram', 'kilos':'kilograms',
          // grams
          'g':'grams', 'gs':'grams', 'gm':'grams',
          // millilitres
          'ml':'mls', 'mls':'mls', 'millitres':'mls','millilitres':'mls',
          //litres
          'liter':'litre','liters':'litres'
          };
        return map[unit.toLowerCase()] || unit.toLowerCase();
      }
      function normalizeFractionsInString(input) {
        const unicodeFractions = {
          '¼': 0.25,
          '½': 0.5,
          '¾': 0.75,
          '⅐': 1/7,
          '⅑': 1/9,
          '⅒': 1/10,
          '⅓': 1/3,
          '⅔': 2/3,
          '⅕': 1/5,
          '⅖': 2/5,
          '⅗': 3/5,
          '⅘': 4/5,
          '⅙': 1/6,
          '⅚': 5/6,
          '⅛': 1/8,
          '⅜': 3/8,
          '⅝': 5/8,
          '⅞': 7/8
        };
    
        // Convert mixed numbers with unicode fraction, e.g. "1 ½"
        input = input.replace(/(\d+)\s*([¼½¾⅐⅑⅒⅓⅔⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞])/g, (match, whole, frac) => {
          return (parseInt(whole, 10) + unicodeFractions[frac]).toString();
        });
    
        // Convert unicode fractions on their own, e.g. "½ cup"
        input = input.replace(/([¼½¾⅐⅑⅒⅓⅔⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞])/g, (match, frac) => {
          return unicodeFractions[frac].toString();
        });
    
        // Convert mixed numbers like "1 1/2"
        input = input.replace(/(\d+)\s+(\d+)\/(\d+)/g, (match, whole, num, den) => {
          return (parseInt(whole, 10) + parseInt(num, 10) / parseInt(den, 10)).toString();
        });
    
        // Convert simple fractions like "1/2"
        input = input.replace(/(\d+)\/(\d+)/g, (match, num, den) => {
          return (parseInt(num, 10) / parseInt(den, 10)).toString();
        });
    
        return input;
      }
    
      // Fix brackets, double measurements, commas
      function checkDoubleUnits(input, unitPattern){
        const line = {filtered:input, inst:'', type:''};
    
        // Separate brackets
        const regexBracket = new RegExp('((?:\\()(.*?)(?:\\)))');
        const matchBracket = line.filtered.match(regexBracket);
        if(matchBracket){
          line.filtered = line.filtered.replace(matchBracket[1],''); //(1 cup)
          line.inst = matchBracket[2]; //1 cup
          line.type = 'bracket';
        }
    
        // Comma
        const regexComma = new RegExp('(,.+)');
        const matchComma = line.filtered.match(regexComma);
        if(matchComma){
          line.filtered =  line.filtered.replace(matchComma[0],'');
          line.inst = matchComma[0].replace(',','').trim(); //, blah blah
          line.type = 'comma';
        }
    
        //Or
        const regexOr = new RegExp('(?:\\s+or|Or\\s)(.+)');
        const matchOr = line.filtered.match(regexOr);
        if(matchOr){
          line.filtered =  line.filtered.replace(matchOr[0],'');
          line.inst = matchOr[0].replace(',','').trim();//or 1 sweet potato
          line.type = 'or';
        }
    
        // Find double measurements
        const regex = new RegExp(`(\\d+(?:\\.\\d+)?)(?:\\s*)(${unitPattern})`, 'g');
        const match = line.filtered.match(regex);
        if(match){
          if(match.length > 1){
            //user could prioritise weight or cup mesurements
            //const item = (match[1].includes('cup'))? match[0]:match[1];
            line.filtered =  line.filtered.replace(match[1],'');
            line.inst = match[1];
            line.type = 'double measurement';
          }
        }
        line.filtered = line.filtered.trim();
        return line;
      }
    
      function parseIngredientFlexible(input) {
        const units = ['mls','ml','g','gm','grams','kg','kilos','t','T','Cup','cup','Cups','cups','tsp','tbsp','Teaspoon','Tablespoon','Teaspoons','Tablespoons','Ts','ts','Tbs','tbs','litres','Tspn'];
        const unitPattern = units.join('|');
        const original = input.replace('▢', '').trim(); //checkbox
        const normalized = normalizeFractionsInString(original);
        input = normalizeQuantity(normalized); //fixes 7 x 60,
        const checkDouble  = checkDoubleUnits(input, unitPattern);
        input = normalizeFractionsInString(checkDouble.filtered);
    
        const result = {
          qty: null,
          unitOriginal: null,
          unit: null,
          inst: checkDouble.inst,
          ingredient: checkDouble.filtered,
          normalized: normalized,
          original: original,
        };
    
        const regex = new RegExp(
          // Pattern 1: quantity + unit + optional 'of' + ingredient
          `(?:^|\\b)(\\d+(?:\\.\\d+)?)(?:\\s*)(${unitPattern})(?:\\s+of)?\\s+(.*)` +
          // Pattern 2: ingredient + quantity + unit
          `|(?:^|\\b)(.*?)(?:\\s+)(\\d+(?:\\.\\d+)?)(?:\\s*)(${unitPattern})(?:\\b|$)` +
          // Pattern 3: quantity + ingredient (no known unit)
          `|(?:^|\\b)(\\d+(?:\\.\\d+)?)(?:\\s+)([a-zA-Z][a-zA-Z ]*)` +
          // Pattern 4: ingredient + quantity (no known unit)
          `|(?:^|\\b)([a-zA-Z][a-zA-Z ]*)(?:\\s+)(\\d+(?:\\.\\d+)?)`,
          'i'
        );
    
        const match = input.match(regex);
    
        if(match){
          if (match[1] && match[2] && match[3]) {
            // Format: 200ml milk
            result.qty =  parseFloat(match[1]),
            result.unitOriginal = match[2];
            result.unit =  standardiseUnits(match[2]),
            result.ingredient =  match[3].trim()
          } else if (match[4] && match[5] && match[6]) {
            // Format: milk 200ml
            result.qty =  parseFloat(match[5]),
            result.unitOriginal =  match[6],
            result.unit =  standardiseUnits(match[6]),
            result.ingredient =  match[4].trim()
          } else if (match[7] && match[8]) {
            // Format: 2 onions
            result.qty =  parseFloat(match[7]),
            result.unit =  'each',
            result.ingredient = match[8].trim()
          } else if (match[9] && match[10]) {
            // Format: 2 onions
            result.qty =  parseFloat(match[10]),
            result.unit =  'each',
            result.ingredient = match[9].trim()
          }
        }
    
        let checkRemainderText = result.normalized.replace(result.ingredient,'').replace(result.qty,'').replace(result.unitOriginal,'').replace(result.inst,'').trim();
        if(checkRemainderText.length!=0){
          checkRemainderText = checkRemainderText.replace(/^\,/, '').replace(/^Of$/i, '').replace(/\((\s+)?\)/, '');
          if(checkRemainderText.length!=0){
            result.inst += ' ' + checkRemainderText;
            result.inst = result.inst.trim();
          }
        }
        return result;
      }

    function multiSorter(fields, lookups = {}) {
      return (a, b) => {
        for (let field of fields) {
          let direction = 1;
    
          // Allow "field:asc" or "field:desc"
          if (field.includes(':')) {
            const [f, dir] = field.split(':');
            field = f;
            direction = dir === 'desc' ? -1 : 1;
          }
    
          let valA = a[field];
          let valB = b[field];
    
          // Use lookup table if defined
          if (lookups[field]) {
            valA = lookups[field].indexOf(valA);
            valB = lookups[field].indexOf(valB);
          }
    
          // Special case for time strings like "HH:MM"
          if (field === 'time') {
            valA = Date.parse(`1970-01-01T${valA}`);
            valB = Date.parse(`1970-01-01T${valB}`);
          }
    
          // Compare
          if (valA < valB) return -1 * direction;
          if (valA > valB) return 1 * direction;
          // if equal, continue to next field
        }
        return 0; // all equal
      };
    }

      function saveAndRender() {
        saveToLocalStorage();
        renderView();
      }
      /*
      function toggleSidePanel(){
        readData.isPanelOpen = !readData.isPanelOpen;
        saveToLocalStorage();   
        setSidePanel(readData.isPanelOpen);        
      } 
      */
      function setDisplayReadButton(){
        dom.showHideReadButton.textContent = (readData.isDisplayRead)? 'Hide Read':'Show Read';
      }
      
      function toggleDisplayRead(){
        readData.isDisplayRead = !readData.isDisplayRead;
        setDisplayReadButton();
        saveAndRender();           
      } 
    
      function updateSidePanel(data) {
        currentReadItemId = data.id;
        dom.panelTitle.value = data.title;
        dom.panelAuthor.value = data.author;
        dom.panelGenre.value = data.genre;
        dom.panelReading.checked = data.reading;
        dom.panelDay.value = data.day;
        dom.panelTime.value = data.time;
        dom.panelTags.value = stringifyTags(data.tags);
      }
    
      function clearSidePanel() {
        updateSidePanel(new ReadItem('', '', '', false, [], null));
      }
    
      function getPanelData() {
        return {
          title: dom.panelTitle.value,
          author: dom.panelAuthor.value,
          genre: dom.panelGenre.value,
          reading: dom.panelReading.checked,
          day: dom.panelDay.value,
          time: dom.panelTime.value, 
          tags: parseTags(dom.panelTags.value),
          updatedAt: timeStamp()
        };
      }
    
      function saveReadItem() {
        const panelData = getPanelData();
        if (currentReadItemId) {
          const existing = readData.books.find(t => t.id === currentReadItemId);
          Object.assign(existing, panelData);
        } else {      
          const newRead = new ReadItem(panelData.title); //for duplicate or copy
          currentReadItemId = newRead.id;
          Object.assign(newRead, panelData);      
          readData.books.push(newRead);
        }
        saveAndRender();
        showToast(`${panelData.title} updated`, 'success');
      }
      
      function duplicateItem(){
        currentReadItemId = null;
        saveReadItem()  
      }
    
      function startNew() {
        let newTitle = dom.titleInput.value.trim();
        if (!newTitle) newTitle = "New Book";    
        const newItem = new ReadItem(newTitle, '', '', false, [], null);
        readData.books.push(newItem);
        updateSidePanel(newItem);
        saveAndRender();
        showToast(`${newTitle} added`, 'success');
      }
      
      function deleteItem(){    
        const index = readData.books.findIndex(r => r.id===currentReadItemId);
        if(index!=-1){
         readData.books.splice(index, 1);
         showToast(`book deleted`, 'success');
        }
        currentReadItemId = null;
        saveAndRender();
      }
    
      // --- Render Functions ---
      function renderView() {
        dom.readView.innerHTML = '';
        
        readData.books.sort((a, b) => {
          if (a.reading !== b.reading) {
            return a.reading ? -1 : 1; // true comes before false
          }
          return a.title.localeCompare(b.title); // A-Z by title
        });
    
        if (readData.books.length === 0) {
          dom.readView.innerHTML = '<div class="no-items">Nothing to read!</div>';
          return;
        }
    
        readData.books.forEach(item => {   
          if(item.reading || readData.isDisplayRead){   
            const div = planitDivCreator(null, `gen-item readit-item ${item.genre.toLowerCase()} reading-${item.reading}`);
            div.dataset.id = item.id;
            div.onclick = () => updateSidePanel(item);
                 
            
            const emojiBlock = planitDivCreator('📘', 'emoji-block');     
            const title = planitDivCreator(item.title, 'readit-title');
            const author = planitDivCreator(item.author, 'readit-author');
            const genre = planitDivCreator(item.genre, 'readit-genre');
            const day = planitDivCreator(item.day, 'readit-day cell-non-essential');
            const time = planitDivCreator(item.time, 'readit-time cell-non-essential');
    
            div.appendChild(emojiBlock);
            div.appendChild(title);
            div.appendChild(author);
            div.appendChild(genre);
            div.appendChild(day);
            div.appendChild(time);            
            dom.readView.appendChild(div);
          }
        });
      }
    
      // --- Save and Load ---
      function loadFromLocalStorage() {
        if (window.getPlanitSection) {
          const saved = getPlanitSection("readit");
          if (saved?.books) {
            try {
              //readData = saved.books;
              readData = saved;
              readData.card = 'readit';
              saveToLocalStorage();
            } catch (e) {
              console.warn("Could not parse saved readit data:", e);
            }
          } else {
            readData.books = [
              new ReadItem('The Hobbit', 'J.R.R. Tolkien', 'Fantasy', false, []),
              new ReadItem('Sapiens', 'Yuval Noah Harari', 'Nonfiction', true, [])
            ];
            saveToLocalStorage();
          }
        }
      }
    
      function saveToLocalStorage() {
        if (window.updatePlanitSection) {
          updatePlanitSection("readit", readData);
        }
      }
      
      // --- Import and Export ---    
      function exportData() {
        exportCardData(readData, 'readit'); //planit.js     
      } 
      
      function importData(event) {
        const file = event.target.files[0];
        if(file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            readData = JSON.parse(e.target.result);
            saveAndRender();
          };
          reader.readAsText(file);
        }
      }
    
      // --- Initialization ---
      function initDomReferences() {
        dom.readView = document.getElementById('readView');
        dom.sidePanel = document.getElementById('sidePanel');
        dom.panelTitle = document.getElementById('title');

        dom.panelGenre = document.getElementById('genre');
        dom.panelReading = document.getElementById('reading');
        dom.panelDay = document.getElementById('day');
        dom.panelTime = document.getElementById('time');    
        dom.panelTags = document.getElementById('tags');
        dom.titleInput = document.getElementById('titleInput');
        
        //autopanel
        dom.panelTitle?.addEventListener('input', saveReadItem); //change = final value on blur
        dom.panelAuthor?.addEventListener('input', saveReadItem); 
        dom.panelGenre?.addEventListener('change', saveReadItem);   
        dom.panelReading?.addEventListener('change', saveReadItem);
        dom.panelDay?.addEventListener('change', saveReadItem);
        dom.panelTime?.addEventListener('change', saveReadItem);
        dom.panelTags?.addEventListener('input', saveReadItem); 
      }
    
      function initButtons() {

      }

        loadFromLocalStorage();
        initButtons();
        renderView();
        getLinkedNotes('readit');

              gameData.card = 'gameit';
              saveToLocalStorage();

              new GameItem('Minecraft', 'PC', 'Sandbox', true, ['survival'])
            ];
            saveToLocalStorage();
          }

        }

        if(file) {

          reader.onload = (e) => {

      function initButtons() {

        document.getElementById('deleteItemButton')?.addEventListener('click', deleteItem);
        document.getElementById('duplicateItemButton')?.addEventListener('click', duplicateItem);

      function init() {

        loadFromLocalStorage();
        initButtons();
        renderView();
        getLinkedNotes('gameit');
      }
    
      init();
    
      window.gameit = {
        init
      };
    
    })();
  };
  cardModules['gameit'] = init;
})();

// buildit.js
(function () {
  // Card logic for buildit
  const init = function() {
(function () {
      'use strict';
    
      // --- Global Declarations ---
      let buildData = {currentProjectId:null, viewType:'list', projects:[], isDisplayComplete:true, isPanelOpen:true, updatedAt:timeStamp(), card:'buildit'};
      let currentProject = {};
      let currentEditItem = {};
      const dom = {};
      const statuses = ['pending', 'complete', 'started', 'ignore'];
      const todaysDate = formatDate(new Date());
    
      // ---Constructor Functions --- 
      function ProjectItem(title, status, type, sortOrder, id) {
        this.title = title;
        this.status = status || 'pending';
        this.type = type || '';
        this.order = sortOrder || 0;
        this.activities = [];
        this.tags = [];
        this.id = id || generateId(); //planit.js
        this.updatedAt = timeStamp();
        this.startDate = null;
        this.durationInDays = null;
      }
      
      function ActivityItem(title, status, type, order, tasks, startDate, endDate, id) {
        this.title = title;
        this.status = status || 'pending';
        this.type = type || '';
        this.order = order || 0;
        this.tasks = tasks || [];
        this.startDate = startDate || todaysDate,
        this.endDate = endDate || todaysDate,
        this.tags = [];
        this.id = id || generateId(); //planit.js
        this.updatedAt = timeStamp();
      }  
    
      function TaskItem(title, status, type, sortOrder, startDate, endDate, id) {
        this.title = title || 'New Task';
        this.status = status || 'pending';
        this.type = type || '';
        this.order = sortOrder || 0;
        this.startDate = startDate || todaysDate,
        this.endDate = endDate || todaysDate,

      } 
      
      // --- Helper Functions ---

        setCurrentView();
      }

      /*
      function toggleSidePanel(){
        buildData.isPanelOpen = !buildData.isPanelOpen;
        saveToLocalStorage();   
        setSidePanel(buildData.isPanelOpen);        
      }

       }

        // buildData.push(newItem);

      function addNewActivity(){
         currentProject.activities.push(new ActivityItem('New Activity'));
         saveAndRender();
      }
      
      
      function addNewTask(activity){

        saveAndRender();
      }
      
      function updateProjectTitle(projectTitle){

      }
      
      function updateTaskTitle(task, title){

        saveAndRender();
      } 
      
      function toggleProjectStatus() {
        const currentIndex = statuses.indexOf(currentProject.status);  
        const nextIndex = (currentIndex + 1) % statuses.length;
        currentProject.status = statuses[nextIndex];
        saveAndRender();
      }
      
      function toggleStatus(task) {

        const nextIndex = (currentIndex + 1) % statuses.length;
        task.status = statuses[nextIndex];
        if(task.status=="complete"){
          showToast(`good job!`, 'success');

      function deleteTask(task, activity) {

      } 
      
      // --- Render Functions ---  
      function renderSelect(){
        dom.projectSelect.innerHTML = '';
        buildData.projects.forEach(project => {
        const option = document.createElement('option');
        option.text = project.title;
        option.value = project.id;

        });
      }
      
      function renderView(){    
        renderSelect();    
        dom.ganttView.classList.add('planit-hidden');
        dom.buildView.classList.remove('planit-hidden'); 
        dom.buildView.innerHTML = '';    
    
        if (buildData.length === 0) {
          dom.buildView.innerHTML = '<div class="no-items">Nothing to build!</div>';
          return;
        }
        
        //update main view
        const div = planitDivCreator(null, `pro-item project-title`);
        div.dataset.id = currentProject.id;
        
        //div.onclick = () => updateSidePanel(project);
        
        const projectTitle = planitDivCreator(currentProject.title, 'activity-title-text');

        projectTitle.onblur = () => updateProjectTitle(projectTitle);

        projectButton.className = 'activity-title-button';
        projectButton.onclick = () => addNewActivity();
        
        
        const projectStatusSvg = createSvg(currentProject.status, 'icon');

          toggleProjectStatus();
        }; 
        
        div.appendChild(projectTitle);
        div.appendChild(projectStatusSvg);
        div.appendChild(projectButton);
        dom.buildView.appendChild(div);
        
        const projectGroup = planitDivCreator(null, 'project-group', 'projectGroup');    
        currentProject.activities.forEach(activity => { 
          const activityGroup = planitDivCreator(null, 'activity-group', activity.id);
          activityGroup.dataset.id = activity.id;
          const activityTitle = planitDivCreator(null, 'pro-item activity-title');         
          //activityTitle.onclick = () => updateSidePanel(activity);
          const titleDiv = planitDivCreator(activity.title, 'activity-title-text');
          titleDiv.contentEditable='true';
          titleDiv.onblur = () => updateTaskTitle(activity, titleDiv);
          
          const addButton = document.createElement('button');
          addButton.innerHTML = '+ Add New Task';
          addButton.className = 'activity-title-button';
          addButton.onclick = () => addNewTask(activity);          
          const dragSvg = createSvg('move', 'icon');   
          
          activityTitle.appendChild(dragSvg);
          activityTitle.appendChild(titleDiv);
          activityTitle.appendChild(addButton);  
                  
          activityGroup.appendChild(activityTitle);
          
          const taskGroup = planitDivCreator(null, 'task-group', activity.id + '-tasks');
          taskGroup.dataset.activityid = activity.id;
          activity.tasks.forEach(task => {            
           // if(task.status!='complete' || buildData.isDisplayComplete){ 
            const additionalClassName = (task.status!='complete' || buildData.isDisplayComplete)? '':'planit-hidden';  
            const taskContainer = planitDivCreator(null, `pro-item task-title ${task.status} ${additionalClassName}`); 
            taskContainer.dataset.id = task.id;           
            taskContainer.onclick = () => updateSidePanel(task, activity);
           
            const taskTitle = planitDivCreator(task.title, 'activity-title-text');           
            taskTitle.contentEditable='true';
            taskTitle.onblur = () => updateTaskTitle(task, taskTitle);
            
            const statusSvg = createSvg(task.status, 'icon');
            statusSvg.onclick = (e) => {
              e.stopPropagation();
              toggleStatus(task);
            }; 
            
            const deleteSvg = createSvg('delete', 'icon');          
            deleteSvg.onclick = (e) => {
              e.stopPropagation();
              deleteTask(task, activity);
            };
            
            const dragSvg = createSvg('move', 'icon');          
    
            
            taskContainer.appendChild(dragSvg);              
            taskContainer.appendChild(taskTitle);
            taskContainer.appendChild(statusSvg);
            taskContainer.appendChild(deleteSvg);  
                 
            taskGroup.appendChild(taskContainer);
            //}
          });
          
          activityGroup.appendChild(taskGroup);
          projectGroup.appendChild(activityGroup);
          dom.buildView.appendChild(projectGroup);
          
          new Sortable(taskGroup, {
            group: 'tasks',
            onAdd: function (evt){
              const currentTasks = findCurrentTasksByActivityId(evt.from.dataset.activityid);          
              const currentTasksDom = document.getElementById(evt.to.dataset.activityid + '-tasks');
              const arrayOfDomItems = currentTasksDom.querySelectorAll('.task-title');
              const toTasks = findCurrentTasksByActivityId(evt.to.dataset.activityid);
              const currentTaskId = currentTasks.findIndex(t => t.id ===  evt.item.dataset.id);
              const currentTask = currentTasks[currentTaskId];
              toTasks.push(currentTask);
              currentTasks.splice(currentTaskId, 1);              
              sortArrayBasedOnDomPosition(arrayOfDomItems, toTasks); 
              saveAndRender(); 
            },
            onUpdate: function (evt){
              // Sort for move in same activity on update
              const activityId = evt.from.dataset.activityid;
              const currentTasks = findCurrentTasksByActivityId(activityId);
              const currentTasksDom = document.getElementById(activityId + '-tasks');
              const arrayOfDomItems = currentTasksDom.querySelectorAll('.task-title');
              sortArrayBasedOnDomPosition(arrayOfDomItems, currentTasks); 
              saveAndRender();  
            }
          })
          });
        
        new Sortable(projectGroup, { 
            onUpdate: function (evt){  
            const arrayOfDomItems = document.querySelectorAll('.activity-group');
            sortArrayBasedOnDomPosition(arrayOfDomItems, currentProject.activities);        
            saveAndRender();
          }
        })
      } 
      
      function findCurrentTasksByActivityId(activityId){
        return  currentProject.activities.find(a => a.id === activityId).tasks;     
      }
      
      function sortArrayBasedOnDomPosition(arrayOfDomItems, arrayOfObjects){
        const newList = [];    
        arrayOfDomItems.forEach(item => { 
          if(item.dataset.id) newList.push(item.dataset.id);   
        });          
        arrayOfObjects.sort((a, b) => newList.indexOf(a.id) - newList.indexOf(b.id));    
      }
        
    // --- Gantt view ---  
      let days = 20;
      let startDate = new Date('2025-06-10');
      let filteredTasks = [];
    
      function changeDayRangeAndDate(dayRange, dateStr){
        currentProject.durationInDays = dayRange;
        currentProject.startDate = dateStr;  
        saveToLocalStorage();  
        renderGanttView();
      }
      
      function forward(){
        const day = new Date(startDate);
        day.setDate(day.getDate() + 1);
        startDate = formatDate(day);    
        changeDayRangeAndDate(days, startDate);
       }
       
      function back(){
        const day = new Date(startDate);
        day.setDate(day.getDate() - 1);
        startDate = formatDate(day);    
        changeDayRangeAndDate(days, startDate);
      }
      
      function zoomOut(){
        days++;
        changeDayRangeAndDate(days, startDate);
      } 
     
      function zoomIn(){
        days--;
        changeDayRangeAndDate(days, startDate);
      } 
      
      function showAll(){
        const dateRange = getProjectDateRange(filteredTasks);
        if(dateRange.startDate){
          const durationInDays = dateDiffInDays(new Date(dateRange.startDate), new Date(dateRange.endDate));    
          changeDayRangeAndDate(durationInDays + 1, dateRange.startDate);
        }
      }
      
      function dateDiffInDays(a, b) {
        const MS_PER_DAY = 1000 * 60 * 60 * 24;
        return Math.round((b - a) / MS_PER_DAY);
      }
    
      function isOdd(num) { 
        return num % 2;
      }
    
      function createBlank(offset, index){
        const blank = planitDivCreator(null);    
        //const blank = document.createElement("div");
        if(offset>days) offset = days; //? fixes -numbers   
        blank.style.gridColumn = `span ${offset}`; 
        if(isOdd(index)){
          blank.className = 'shade';
          blank.innerHTML = '&nbsp;';
        }else{
          blank.className = 'light';  
        } 
        return blank;
      } 
      
      function getProjectDateRange(tasks) {
        if (!tasks.length) return { startDate: null, endDate: null };
        let earliest = tasks[0].startDate;
        let latest = tasks[0].endDate;
        for (const task of tasks) {
          if (task.startDate < earliest) earliest = task.startDate;
          if (task.endDate > latest) latest = task.endDate;
        }
        return { startDate: earliest, endDate: latest };
      }
      
      function getDateFromIso(dateStr){
        const timestamp = Date.parse(dateStr);
        if(isNaN(timestamp) == false) {
          return new Date(dateStr);
        }else{
          return new Date();
        }
      } 
    
      function renderGanttView(){
        renderSelect();
        dom.buildView.classList.add('planit-hidden'); 
        dom.ganttView.classList.remove('planit-hidden');
        dom.ganttContainer.innerHTML = '';
       
        filteredTasks = [];     
        currentProject.activities.forEach(activity => {          
          activity.tasks.forEach(task => { 
            if(task.status!='complete' || buildData.isDisplayComplete){ 
              if(!task.startDate) task.startDate = todaysDate;
              if(!task.endDate) task.startDate = endDate;        
              filteredTasks.push({title:task.title, status:task.status, startDate:task.startDate, endDate:task.endDate});
            }
          })
        });
        
        days = currentProject.durationInDays;
        startDate = new Date(currentProject.startDate);
         
        const ganttLineDiv = planitDivCreator(null, 'gantt-row gantt-row-lines', 'ganttLines');        
        ganttLineDiv.style.gridTemplateColumns = `150px repeat(${days}, 1fr)`;
        
        dom.ganttContainer.style.gridTemplateColumns = `150px repeat(${days}, 1fr)`;
        dom.ganttContainer.appendChild(ganttLineDiv);
    
        const label = planitDivCreator(null, 'day-label');
        label.style.opacity = '0';
      
        dom.ganttContainer.appendChild(label);
        dom.ganttLines = document.getElementById('ganttLines');
           
    
        // Add date headers
        for (let d=0; d<days; d++) {
          const day = new Date(startDate);
          day.setDate(day.getDate() + d);
          const dayIso = formatDate(day);
          
          const label = planitDivCreator(day.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }), 'day-label');
          dom.ganttContainer.appendChild(label);
          
          // Required to pad out start
          if(d==0){
            dom.ganttLines.appendChild(document.createElement("div"));  
          }
                      
          const ganttLineDiv = document.createElement("div");      
          if(dayIso==todaysDate){ //get for today's date
              ganttLineDiv.className = 'marker';
          }      
          dom.ganttLines.appendChild(ganttLineDiv);
        }
        
        //check date-label heights are the same
        let maxHeight = 0;
        const dateLabels = document.querySelectorAll(".day-label");
        dateLabels.forEach(dateLabel => {
          const elementHeight = dateLabel.offsetHeight;
          if(elementHeight>maxHeight) maxHeight = elementHeight    
        });
        
        dateLabels.forEach(dateLabel => {
          dateLabel.style.height = maxHeight + 'px';
        });
        
              
        // Add each task row
        filteredTasks.forEach((task, index) => {      
          const rowClassName = (isOdd(index))? ' shade':' light';
          const start = getDateFromIso(task.startDate);
          const end = getDateFromIso(task.endDate);
          let startOffset = dateDiffInDays(startDate, start);
          let endOffset = dateDiffInDays(startDate, end);
          let duration = dateDiffInDays(start, end) + 1;
          let additionalStyle = '';
          const total = startOffset + duration;
    
          if(startOffset<0 && total>days){    
            startOffset = 0;
            duration = days;
            additionalStyle = ' bar-before-off-chart';
          }else if(total>days){
            duration = days-startOffset;
            additionalStyle = ' bar-off-chart'  
          }else if(startOffset<0){
            duration += startOffset;
            startOffset = 0;
            additionalStyle = ' bar-before-chart'  
          } 
          
          if(task.status==='complete'){
            additionalStyle += ' bar-complete';   
          }
          
            
          // Add label
          const label = planitDivCreator(task.title, 'label' + rowClassName);
          dom.ganttContainer.appendChild(label);
    
          if(startOffset!=0){
           dom.ganttContainer.appendChild(createBlank(startOffset, index));
          }
                
          //if the start offset is less than display days then it starts before last display day
          //if endOffset (difference between) is greater or equal to 0
          if(startOffset<days && endOffset>=0){
            const barContainer = planitDivCreator(null, rowClassName);
            barContainer.style.gridColumn = `span ${duration}`;
            
            const bar = planitDivCreator(task.title, 'bar' + additionalStyle);         
            bar.dataset.start = task.startDate;
            bar.dataset.end = task.endDate;
            barContainer.appendChild(bar);
            dom.ganttContainer.appendChild(barContainer);         
          }
    
          const remaining = days - startOffset - duration;        
          if(remaining!=0){     
           dom.ganttContainer.appendChild(createBlank(remaining, index));
          }      
        });
      }
        
      // --- Save and Load ---
      function loadFromLocalStorage() {
        if (window.getPlanitSection) {
          const saved = getPlanitSection("buildit"); //planit.js
          if (saved?.projects) {
            try {
              buildData = saved;
              setCurrentProject(); 
              setCurrentView();
              //buildData.card = 'buildit';
              //saveToLocalStorage();
            } catch (e) {
              console.warn("Could not parse saved buildit data:", e);
            }
          } else {
            const starterProject = new ProjectItem('Bird House', 'pending', 'hobby project');
            buildData.currentProjectId = starterProject.id;
            const activity1 = new ActivityItem('buy materials');
            const activity2 = new ActivityItem('carpentry');
            activity1.tasks.push(new TaskItem('buy nails', null, null, 0, '2025-06-10', '2025-06-12')); 
            activity1.tasks.push(new TaskItem('buy wood', null, null, 0, '2025-06-12', '2025-06-14')); 
            activity2.tasks.push(new TaskItem('cut roof', null, null, 0, '2025-06-14', '2025-06-15')); 
            activity2.tasks.push(new TaskItem('drill bird house entrance', null, null, 0, '2025-06-16', '2025-06-20'));     
            starterProject.activities.push(activity1); 
            starterProject.activities.push(activity2);
            buildData.projects = [starterProject];
            saveToLocalStorage();
          }
        }
      }
    
      function saveToLocalStorage() {
        if (window.updatePlanitSection) {
          updatePlanitSection("buildit", buildData); //planit.js
        }
      }
    
      // --- Import and Export ---    
      function exportData() {
        exportCardData(buildData, 'buildit'); //planit.js     
      } 
      
      function importData(event) {
        const file = event.target.files[0];
        if(file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            buildData = JSON.parse(e.target.result);
            saveAndRender();
          };
          reader.readAsText(file);
        }
      }
      
      function changeProject(){
        setCurrentProject(dom.projectSelect.value);
        saveAndRender(); 
      }
        
      // --- Initialization ---
      function initDomReferences(){
        dom.projectSelect = document.getElementById('projectSelect');
        dom.buildView = document.getElementById('buildView');
        dom.ganttView = document.getElementById('ganttView');
        dom.sidePanel = document.getElementById('sidePanel');    
        dom.panelTitle = document.getElementById('title');

      function createWeeksRow(startMonth){
        const plantRow = planitDivCreator(null, 'gantt-row plant-row', 'plantRow');

        const yearOfWeeksPercent = 100/52;
        const startPercentage = firstDayOfMonth/7;
        const endPercentage = (7-firstDayOfMonth)/7;
    
        for(let i=0; i<53; i++){
          const div = planitDivCreator(null);
          //const div = document.createElement('div');
          plantRow.appendChild(div);
        }
        const startCol = yearOfWeeksPercent * startPercentage;
        const endCol = yearOfWeeksPercent * endPercentage;
        const styleStrWeek = `${startCol}% repeat(51, ${yearOfWeeksPercent}%) ${endCol}%`;
        plantRow.style.gridTemplateColumns = styleStrWeek;
        dom.ganttWrapper.appendChild(plantRow);

      function getCssGradientPercent(sectionDays, totalGrowDays, daysFromStartDate, plantTitle){
        const sectionDaysFromStartDate = daysFromStartDate + sectionDays;
        let visibleGrowDays = totalGrowDays;
        if(daysFromStartDate < 0){
          sectionDays = sectionDaysFromStartDate;
          visibleGrowDays = daysFromStartDate + totalGrowDays;
        }
        if(sectionDaysFromStartDate < 0){
          sectionDays = 0;
        }
        return (sectionDays / visibleGrowDays) * 100;
      }

        const plantsContainer = planitDivCreator(null, 'plants-container', 'plantsContainer');
        const firstDayOfMonthDate = new Date(`${ganttDate.year}-${ganttDate.month}-01`);
        growData.growing.forEach(plant => {
    
          if(!plant.dateSown) plant.dateSown = currentGrowDate;
    
          const dateSown = new Date(plant.dateSown)
          const daysFromStartDate = dateDifferenceInDays(firstDayOfMonthDate,dateSown);
          const totalGrowDays = plant.germMaxDays + plant.matureMaxDays;
    
          // Out of chart date range
          if(daysFromStartDate + totalGrowDays>0 && daysFromStartDate < 364){
    
            const plantRow = planitDivCreator(null, 'plant-rows');
            const plantStartBuffer = planitDivCreator(null, null);
            const startBufferWidth = daysFromStartDate * dayPercent;
            plantStartBuffer.style = `width:${startBufferWidth}%;`;
    
            const plantCell = planitDivCreator(plant.title, 'plant-cell');
            plantCell.onclick = () => updatePanelGrowItem(plant, 'growing');
    
            const germMinPercent = getCssGradientPercent(plant.germMinDays, totalGrowDays, daysFromStartDate, plant.title);
            const germMaxPercent = getCssGradientPercent(plant.germMaxDays, totalGrowDays, daysFromStartDate, plant.title);
            const matureMinPercent = getCssGradientPercent(plant.germMaxDays + plant.matureMinDays, totalGrowDays, daysFromStartDate, plant.title);
    
            let totalWidth = totalGrowDays * dayPercent;
            const maxwidth = 100-startBufferWidth;
    
            if(totalWidth>maxwidth){
              totalWidth = maxwidth;
              plantCell.classList = 'plant-cell plant-cell-truncate'
            }
    
            if(daysFromStartDate<0){
              totalWidth = (daysFromStartDate + totalGrowDays) * dayPercent;
              plantCell.classList = 'plant-cell plant-cell-fruncate'
            }
    
            plantCell.style = `
            width:${totalWidth}%;
            background: linear-gradient(
              to right,
              #507BC0 0%,
              #507BC0 ${germMinPercent}%,
              #5093C0 ${germMinPercent}%,
              #5093C0 ${germMaxPercent}%,
              #91C050 ${germMaxPercent}%,
              #91C050 ${matureMinPercent}%,
              #54AA6B ${matureMinPercent}%,
              #54AA6B 100%
              );`;

            const harvestCell = planitDivCreator('harvest', 'plant-cell harvest-cell');

            plantRow.appendChild(plantCell);
            plantRow.appendChild(harvestCell);
            plantsContainer.appendChild(plantRow);
            dom.ganttWrapper.appendChild(plantsContainer);
         }
        });

          if (a.dateSown !== b.dateSown) {

          }
          return a.title.localeCompare(b.title); // A-Z by title

      function getDate(date, days){
        const startDate = new Date(date);
        const calculatedDate = startDate.setDate(startDate.getDate() + days);
        return new Date(calculatedDate).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric'});
        //return formatDate(new Date(calculatedDate));
      }
    
      function getRelativeX(event) {
        const rect = dom.ganttWrapper.getBoundingClientRect();
        let clientX;
        if (event.type.startsWith("touch")) {
          clientX = event.touches[0].clientX; // first touch point
        } else {
          clientX = event.clientX;
        }
        return clientX - rect.left;
      }
    
      function handleMove(event) {
        const xPos = getRelativeX(event);
        const ganttWrapperWidth = Math.round(dom.ganttWrapper.clientWidth);
        //const percentage = Math.round((xPos/800) * 100);
        let daysToAdd = Math.round((xPos/ganttWrapperWidth) * 365);
        dom.dateOutput.textContent = getDate(`${ganttDate.year}-${ganttDate.month}-01`, daysToAdd);
        // Constrain the line inside the div
        const clampedX = Math.max(0, Math.min(xPos, ganttWrapperWidth));
        dom.trackerLine.style.left = clampedX + "px";
      }

(function () {
  // Card logic for labelit
  const init = function() {
(function () {
      'use strict';
    
      // --- Global Declarations ---
      let labelData = {pages:[], currentPage:'', pageSize:'', isPanelOpen:true, updatedAt:timeStamp(), card:'labelit'};
      let currentPageId = null;
      const dom = {};
      const paperSizes = [
        {title:'A4', width:'794px',height: '1123px'},
        {title:'Letter', width:'816px',height: '1056px'},
      ];
    
      // --- Constructor Functions ---
      function PageItem(title, labels, fontSize, rowNumberValue, colNumberValue, id) {
        this.title = title;
        this.labels = labels;
        this.fontSize = fontSize;
        this.rowNumber = rowNumberValue || 10;
        this.colNumber = colNumberValue || 2;
        this.id = id || generateId();
        this.updatedAt = timeStamp();
      }
    
      // --- Helper Functions ---
      /*
      function toggleSidePanel(){
        labelData.isPanelOpen = !labelData.isPanelOpen;
        saveToLocalStorage();
        setSidePanel(labelData.isPanelOpen);
      }
      */
      function addPage(){
        //const pageTitle = dom.pageName.value.trim();
        const labelPageTitle = (dom.titleInput.value)? dom.titleInput.value:'New Page';
        const id = generateId;
        labelData.pages.push(new PageItem(labelPageTitle, [], '30', null, null, id));
        currentPageId = id;
        labelData.currentPage = labelPageTitle;
        saveAndRender();
      }
    
      function changePaperSize(){
        labelData.pageSize = dom.pageSizeSelect.value;
        const paperSize = paperSizes.find(p => p.title === labelData.pageSize);
        if(paperSize){
            dom.printPage.style.width =  paperSize.width;
            dom.printPage.style.height =  paperSize.height;
            saveAndRender();
        }
      }
    
      function changeFontSize(){
        labelData.pages[currentPageId].fontSize = dom.fontSizeSelect.value;
        saveAndRender()
      }
    
      function changeRowNumber(){
        labelData.pages[currentPageId].rowNumber = dom.rowNumber.value;
        saveAndRender();
      }
    
      function changePage(){
        if(dom.pageSelect.value){
          labelData.currentPage = dom.pageSelect.value;
        }
        //labelData.currentPage = labelData.pages[0].title; //fallback
    
        currentPageId = labelData.pages.findIndex(p => p.title === labelData.currentPage) || 0;
        const thisPage = labelData.pages[currentPageId];
        dom.rowNumber.value = thisPage.rowNumber;
        dom.colNumber.value = thisPage.colNumber;
        dom.fontSizeSelect.value = thisPage.fontSize;
        changeColNumber();
      }
    
      function changeColNumber(updateOnly){
        labelData.pages[currentPageId].colNumber = dom.colNumber.value;
        const gridTempCols = ['', '100%', '50% 50%', '33% 33% 33%', '25% 25% 25% 25%'];
        const gtcValue = gridTempCols[dom.colNumber.value];
        dom.printPage.style.gridTemplateColumns = gtcValue;
        saveAndRender();
      }
    
      function saveAndRender(){
        saveToLocalStorage();
        renderView();
      }
    
      function printPage(){
        window.print();
      }
    
      function updateLabels(id){
        labelData.pages[currentPageId].labels[id] = document.getElementById('label_' + id).innerText.trim();
        labelData.pages[currentPageId].updatedAt = timeStamp();
        saveToLocalStorage(); //save only
      }
    
      function createLabel(labelText, id){
        //const label = document.createElement("div");
        const label = planitDivCreator(labelText, 'label', 'label_' + id);
        //label.id = 'label_' + id;
        //label.className = 'label';
        label.contentEditable = 'true';
        label.style.fontSize = labelData.pages[currentPageId].fontSize + 'px';
        label.spellcheck = 'true';
        //label.textContent = labelText;
        label.onkeyup = () => updateLabels(id);
        return label;
      }
    
      function createBlankLabels(labelCount){
        const thisPage = labelData.pages[currentPageId];
        const totalLabelsOnPage = Number(thisPage.rowNumber) * Number(thisPage.colNumber);
        const fillLabelCount = totalLabelsOnPage-thisPage.labels.length;
        for(let i=0; i<fillLabelCount; i++){
          dom.printPage.appendChild(createLabel("-", labelCount));
          labelCount++;
        }
      }
    
      // --- Render Functions ---
      function renderView(){
        dom.printPage.innerHTML = '';
    
        //Populate page dropdown
        dom.pageSelect.innerHTML = '';
        labelData.pages.forEach(page => {
          const option = document.createElement("option");
          option.text = page.title;
          option.selected = (page.title===labelData.currentPage)? 'selected':'';
          dom.pageSelect.add(option);
        });
    
        let i=0;
        const pageTitle = (labelData.currentPage)? labelData.currentPage:dom.pageSelect.value;
        currentPageId = labelData.pages.findIndex(p => p.title === pageTitle);
        const pageData = labelData.pages[currentPageId];
        pageData.labels.forEach(labelText => {
          dom.printPage.appendChild(createLabel(labelText, i));
          i++;
        });
        createBlankLabels(i);
      }
    
      // --- Save and Load ---
      function saveToLocalStorage() {
        if (window.updatePlanitSection) {
          updatePlanitSection('labelit', labelData); //planit.js
        }
      }
    
      function loadFromLocalStorage() {
        if (window.getPlanitSection) {
          const saved = getPlanitSection('labelit'); //planit.js
          if (saved?.pages) {
            try {
              labelData = saved;
              labelData.card = 'labelit';
              saveToLocalStorage();
            } catch (e) {
              console.warn('Could not parse saved labelit data:', e);
            }
          } else {
            labelData.currentPage = 'pantry';
            labelData.pageSize = 'A4';
            labelData.pages.push(new PageItem('pantry', ["Rice","Sugar","Flour","Tea"], '30'));
            labelData.pages.push(new PageItem('workshop',["Screws","Bolts","Washers"], '32'));
          }
        }
      }
    
      // --- Import and Export ---
      function exportData() {
        exportCardData(labelData, 'labelit'); //planit.js
      }
    
      function importData(event) {
        const file = event.target.files[0];
        if(file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            //check structure
            labelData = JSON.parse(e.target.result);
            saveAndRender();
          };
          reader.readAsText(file);
        }
      }
    
      // --- Start Font ---
      function detectFont(font) {
        const testString = "abcdefghijklmnopqrstuvwxyz0123456789";
        const testSize = "72px";
    
        const baseFonts = ["monospace", "sans-serif", "serif"];
        const body = document.body;
    
        const span = document.createElement("span");
        span.style.fontSize = testSize;
        span.innerHTML = testString;
        span.style.position = "absolute";
        span.style.left = "-9999px";
    
        const defaultWidths = {};
    
        baseFonts.forEach(base => {
          span.style.fontFamily = base;
          body.appendChild(span);
          defaultWidths[base] = span.offsetWidth;
          body.removeChild(span);
        });
    
        for (let base of baseFonts) {
          span.style.fontFamily = `${font},${base}`;
          body.appendChild(span);
          const width = span.offsetWidth;
          body.removeChild(span);
          if (width !== defaultWidths[base]) return true;
        }
        return false;
      }
    
      const fontList = [
        "Arial", "Verdana", "Tahoma", "Trebuchet MS", "Times New Roman", "Georgia", "Inter",
        "Garamond", "Courier New", "Brush Script MT", "Comic Sans MS", "Impact", "Lucida Console"
      ];
    
      const select = document.getElementById("fontSelect");
      fontList.forEach(font => {
        if (detectFont(font)) {
          const option = document.createElement("option");
          option.value = font;
          option.textContent = font;
          option.style.fontFamily = font;
          select.appendChild(option);
        }
      });
    
      select.addEventListener('change', (e) => {
        document.querySelectorAll('.label').forEach(el => {
          el.style.fontFamily = e.target.value;
        });
      });
    
      // --- Initialization ---
      function initDomReferences() {
        dom.sidePanel = document.getElementById('sidePanel');
        dom.printPage = document.getElementById('printPage');
        dom.titleInput = document.getElementById('titleInput');
        dom.pageSelect = document.getElementById('pageSelect');
        dom.pageSelect?.addEventListener('change', changePage);
        dom.pageSizeSelect = document.getElementById('pageSizeSelect');
        dom.pageSizeSelect?.addEventListener('change', changePaperSize);
        dom.fontSizeSelect = document.getElementById('fontSizeSelect');
        dom.fontSizeSelect?.addEventListener('change', changeFontSize);
        dom.rowNumber = document.getElementById('rowNumber');
        dom.rowNumber?.addEventListener('change', changeRowNumber);
        dom.colNumber = document.getElementById('colNumber');
        dom.colNumber?.addEventListener('change', changeColNumber)
        dom.pageName = document.getElementById('pageName');
      }
    
      function initButtons(){
        dom.page?.addEventListener('onkeyup', saveToLocalStorage);
        document.getElementById('printButton')?.addEventListener('click', printPage);
        document.getElementById('addPageButton')?.addEventListener('click', addPage);
    
        document.getElementById('sidePanelButton')?.addEventListener('click', toggleSidePanelUniversal);
      }
    
      function init(){
        initDomReferences();
        loadFromLocalStorage();
        initButtons();
        changePage();
        changePaperSize();
        getLinkedNotes('labelit');
      }
    
      init();
    
      window.labelit = {
        init
      };
    
    
    })();
  };
  cardModules['labelit'] = init;
})();

(function () {
  // Card logic for affirmit
  const init = function() {
(function () {
      'use strict';
    
      // --- Global Declarations ---
      let timer = false;
      let letterTimeout;
      let affirmItem = {};
      let affirmData = {affirmations:[], currentAffirmId:'', isPanelOpen:true, updatedAt:timeStamp(), card:'affirmit'};
      const dom = {};   
      
      // --- Constructor --- 
      function AffirmationItem(title, content, attribution, type, tags, id) {
        this.title = title;
        this.content = content || '';
        this.attribution = attribution || '';
        this.type = type || '';
        this.tags = tags || '';
        this.id = id || generateId(); //planit.js
        this.chantCount = 0;
        this.updatedAt = timeStamp();
      }  
    
      // --- Helper Functions ---
      function getLinkedNotes(cardName){
        const linkedNotes = document.getElementById('linkedNotes');
        const noteData = getPlanitSection('noteit'); 
        if(noteData?.notes){
          noteData.notes.forEach(note => {
            const linkedToCard = note?.linkedToCard;
            if(linkedToCard===cardName){
               const button = document.createElement('button');
               button.textContent = note.title; 
               button.dataset.id = note.id;
               button.onclick = () => loadView('noteit', 'currentNoteId', button.dataset.id);
               if(linkedNotes) linkedNotes.appendChild(button);
            }        
          });      
        }
      }
      
      
      
      function getAffirmIndex(){
        let index = affirmData.affirmations.findIndex(n => n.id === affirmData.currentAffirmId);
        if (index==-1) index = 0;
        affirmItem = affirmData.affirmations[index];
        //console.log(affirmItem);
        return index
      }
      /*
      function toggleSidePanel(){
        affirmData.isPanelOpen = !affirmData.isPanelOpen;
        saveToLocalStorage();   
        setSidePanel(affirmData.isPanelOpen);        
      } 
    */
      function addDiv(line){
        var id = "content_" + line;
        //const chant = document.createElement('div');
        const chant = planitDivCreator(null, null, id);
        //chant.id = id;
        chant.style = 'opacity:' + (Number(Math.random().toFixed(2)) + 0.2); 
        dom.chantContainer.appendChild(chant)
        dom.currentDiv = document.getElementById(id);
      }
    
      function startChant(){
        const counterText = document.getElementById(`id_${affirmItem.id}`);    
        clearInterval(timer);
        timer = false;    
        var startCount = affirmItem.chantCount;
        var i = 0;
        timer = setInterval(frame, 40);
        var spaceCount = 0;
        var line = 0;
        addDiv(line);
        function frame() {
          if(!document.getElementById('chantContainer')){
            clearInterval(timer);
            timer = false
          }
          if(spaceCount>0){
            spaceCount-=1;
          }else{
            if (i > affirmItem.content.length) {
              i = 0;
              spaceCount = 5;
              affirmItem.chantCount++;
              counterText.textContent = affirmItem.chantCount;
              saveToLocalStorage();
              line++;
              const rect = dom.chantContainer.getBoundingClientRect()
              if(line===5){
                dom.chantContainer.innerHTML = '';
                line = 0;
              }
              addDiv(line);
            }else{
              var letter = affirmItem.content.charAt(i);
              if(letter == ' '){
                spaceCount = 5; //cycles through 5 ticks between words
              }
               try {
                dom.currentDiv.textContent += letter;
              } catch (e) {
            return false;
            }       
              i++;
            }
          }
        }
      }
        
      function saveAndRender() {
        saveToLocalStorage();
        renderView();
      }
      
      function addLettersOneByOne(text, delay) {
        let index = 0;
        clearTimeout(letterTimeout); 
        function addNextLetter() {
          if (index < text.length) {
            const letter = text.charAt(index);
            dom.toast.textContent += letter;
            index++;
            let writeDelay = (letter===' ')? (delay*4):delay; 
            //setTimeout(addNextLetter, writeDelay);
            letterTimeout = setTimeout(addNextLetter, writeDelay);
          }
        }
        addNextLetter();
      }
    
      function updateSidePanel(data) {
        affirmData.currentAffirmId = data.id;
        const index = getAffirmIndex();
        dom.chantContainer.innerHTML = '';
        startChant();    
        dom.panelTitle.value = data.title;
        dom.panelContent.value = data.content;
        dom.panelAttribution.value = data.attribution;
        dom.panelType.value = data.type;
        dom.panelTags.value = Array.isArray(data.tags) ? data.tags.join(', ') : data.tags || '';
      }
    
      function clearSidePanel() {
        updateSidePanel(new affirmItem('', '', '', false, '', [], null));
      }
    
      function getPanelData() {
        return {
          title: dom.panelTitle.value,
          content: dom.panelContent.value,
          attribution: dom.panelAttribution.value,
          type: dom.panelType.value,
          tags: parseTags(dom.panelTags.value),
          updatedAt: timeStamp(),
        };
      }
    
      function saveItem() {
        const panelData = getPanelData();
        if (affirmData.currentAffirmId) {
          const existing = affirmData.affirmations.find(t => t.id === affirmData.currentAffirmId);
          Object.assign(existing, panelData);
        } else {
          affirmData.push(new affirmItem(
            panelData.title,
            panelData.service,
            panelData.type,
            panelData.affirming,
            panelData.day,
            panelData.tags,
            null
          ));
        }
        saveAndRender();
        //showToast(`${panelData.title} updated`, 'success');
      }
    
      function startNew() {
        let newContent = dom.contentInput.value.trim();
        if (!newContent) newContent = 'New Affirmation Text'
        const newItem = new AffirmationItem('New', newContent);
        affirmData.affirmations.push(newItem);
        saveAndRender();
        updateSidePanel(newItem);
        showToast(`${newContent} added`, 'success');
        dom.contentInput.value = '';
      }
      
      function deleteItem(){
        const index = affirmData.affirmations.findIndex(a => a.id === affirmData.currentAffirmId);
        if(index!=-1){
          affirmData.affirmations.splice(index, 1);
          showToast(`affirmation deleted`, 'success');
        }
        affirmData.currentAffirmId = null;
        saveAndRender();    
      }
    
      // --- Render Functions ---
      function renderView() {
        dom.affirmView.innerHTML = '';
        dom.quoteContainer.innerHTML = '';
    
        if (affirmData.length === 0) {
          dom.affirmView.innerHTML = '<div class="no-items">Nothing to affirm!</div>';
          return;
        }
    
        affirmData.affirmations.sort((a, b) => {
          return a.attribution.localeCompare(b.attribution); // A-Z by title
          return a.title.localeCompare(b.title); // A-Z by title
        });
    
        affirmData.affirmations.forEach(item => {
          const div = planitDivCreator(null, 'gen-item affirmit-item'); 
          div.dataset.id = item.id;
          div.onclick = () => updateSidePanel(item);
          const emojiBlock = planitDivCreator('🪷', 'emoji-block');
          const title = planitDivCreator(item.title, 'affirmit-title cell-non-essential');      
          const content = planitDivCreator(item.content, 'affirmit-content');
          const attribution = planitDivCreator(item.attribution, 'affirmit-attribution');
          const type = planitDivCreator(item.type, 'affirmit-type cell-non-essential');
          const chantCount = planitDivCreator(item.chantCount, 'affirmit-chant-count',`id_${item.id}`);
          
          div.appendChild(emojiBlock);            
          div.appendChild(title);
          div.appendChild(content);
          div.appendChild(attribution);  
          div.appendChild(type);
          div.appendChild(chantCount);       
          dom.affirmView.appendChild(div);
          
          if(item.type==='quote'){
            const quoteBlock = planitDivCreator(null, 'quote-block');
            //const quoteTitle = planitDivCreator(item.title, 'quote-title');
            const quoteContent = planitDivCreator(item.content, 'quote-content');
            const quoteAttribution = planitDivCreator(item.attribution, 'quote-attribution');        
            //quoteBlock.appendChild(quoteTitle);
            quoteBlock.appendChild(quoteContent);
            quoteBlock.appendChild(quoteAttribution);        
            dom.quoteContainer.appendChild(quoteBlock);
          }      
        });
      }
    
      // --- Save and Load ---
      function loadFromLocalStorage() {
        if (window.getPlanitSection) {
          const saved = getPlanitSection('affirmit'); //planit.js
          if (saved?.affirmations) {
            try {
              affirmData = saved;
              getAffirmIndex();  
              affirmData.card = 'affirmit';
              saveToLocalStorage();
            } catch (e) {
              console.warn("Could not parse saved affirmit data:", e);
            }
          } else {
            const id = generateId();
            affirmData.currentAffirmId = id;        
            affirmData.affirmations = [
              new AffirmationItem('Peace', 'May all world leaders wish for peace', 'Humanism', 'chant', [], id),
              new AffirmationItem('Metta', 'May all beings have happiness, and the causes of happiness', 'Buddhism', 'chant'),
              new AffirmationItem('Om', 'Do not let the behavior of others destroy your inner peace.', 'Dalai Lama', 'quote')          
            ];
            getAffirmIndex();
            saveToLocalStorage();
          }
        }
      }
    
      function saveToLocalStorage() {
        if (window.updatePlanitSection) {
          updatePlanitSection("affirmit", affirmData); //planit.js
        }
      }
    
      // --- Import and Export ---    
      function exportData() {
        exportCardData(affirmData, 'affirmit'); //planit.js     
      } 
      
      function importData(event) {
        const file = event.target.files[0];
        if(file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            affirmData = JSON.parse(e.target.result);
            saveAndRender();
          };
          reader.readAsText(file);
        }
      }
        
      // --- Initialization ---
      function initDomReferences() {
        dom.affirmView = document.getElementById('affirmView');
        dom.sidePanel = document.getElementById('sidePanel');
        dom.panelTitle = document.getElementById('title');
        dom.panelContent = document.getElementById('content');
        dom.panelAttribution = document.getElementById('attribution');
        dom.panelType = document.getElementById('type');
        dom.panelTags = document.getElementById('tags');
    
        dom.contentInput = document.getElementById('contentInput');
        //dom.container = document.querySelector('.container');
        //dom.statistics = document.querySelector('.statistics');
        dom.chantContainer = document.getElementById('chantContainer'); 
        dom.quoteContainer = document.getElementById('quoteContainer');  
        dom.currentDiv = null;  
     
        //panel
        dom.panelTitle?.addEventListener('input', saveItem); //change = final value on blur
        dom.panelContent?.addEventListener('input', saveItem); 
        dom.panelAttribution?.addEventListener('input', saveItem); 
        dom.panelType?.addEventListener('change', saveItem);
        dom.panelTags?.addEventListener('input', saveItem);  
        //dom.panelaffirming?.addEventListener('change', saveItem);
        //dom.panelDay?.addEventListener('change', saveItem);
        
      }
    
      function initButtons() {
        document.getElementById('addNewButton')?.addEventListener('click', startNew);
        document.getElementById('saveItemButton')?.addEventListener('click', saveItem);
        document.getElementById('deleteItemButton')?.addEventListener('click', deleteItem);
    
        //Import Export Json Data
        document.getElementById('exportDataButton')?.addEventListener('click', exportData);
        const importDataButton = document.getElementById('importDataButton');
        const hiddenFileInput = document.getElementById('hiddenFileInput');
        importDataButton?.addEventListener("click", () => hiddenFileInput?.click());
        hiddenFileInput?.addEventListener("change", importData);
        
        //document.getElementById("sidePanelButton")?.addEventListener("click", toggleSidePanel);
        document.getElementById('sidePanelButton')?.addEventListener('click', toggleSidePanelUniversal);
      }
    
      function init() {
        initDomReferences();
        loadFromLocalStorage();
        initButtons();
        renderView();
        startChant();
        getLinkedNotes('affirmit');
      }
    
      init();
    
      window.affirmit = {
        init
      };
    
    })();
  };
  cardModules['affirmit'] = init;
})();

          const length = range.toString().length;

        marker.style.height = '0';
        marker.textContent = '';
        range.insertNode(marker);

      function EventItem(title,type, card, scheduleStatus, startDate, endDate, startTime, endTime, purpose, status, repeat, repeatEndDate, subtasks, tags, id){
       this.title = title;
       this.type = type || 'event';
       this.card = card || 'eventit';

       this.startDate = startDate || todayStr;
       this.endDate = endDate || '';

       this.status = status || '';
       this.repeat = repeat || '';
       this.repeatEndDate = repeatEndDate || '';
       this.subtasks = subtasks || [];
       this.tags = tags || [];
       this.id = id || generateId();
       this.updatedAt = timeStamp();
      }

      function saveAndRender() {

        renderView();
      }

        eventData.isPanelOpen = !eventData.isPanelOpen;
        saveToLocalStorage();
        setSidePanel(eventData.isPanelOpen);
      }

        dom.panelEndDate.value = data.endDate;

        dom.panelPurpose.value = data.purpose;

        updateSidePanel(new EventItem('', '', '', false, '', [], null));
      }
    
      function getPanelData() {
        return {
          title: dom.panelTitle.value,
          type: dom.panelType.value,
          startDate: dom.panelStartDate.value,
          endDate: dom.panelEndDate.value,
          startTime: dom.panelStartTime.value,

          purpose: dom.panelPurpose.value,

          repeatEndDate: dom.panelRepeatEndDate.value,
          tags: parseTags(dom.panelTags.value),
          updatedAt: timeStamp(),
        };
      }
    
      function saveItem() {
        const panelData = getPanelData();
        if (currentEventItemId) {
          const existing = eventData.events.find(t => t.id === currentEventItemId);
          Object.assign(existing, panelData);
        } else {

            panelData.title,
            panelData.type,
            null, //card
            null, //scheduleStatus,
            panelData.startDate,
            panelData.endDate,
            panelData.startTime,
            panelData.endTime,
            panelData.purpose,
            panelData.status,
            panelData.repeat,
            panelData.repeatEndDate,

            panelData.tags
          ));

        eventData.events.push(newItem);

      function deleteItem(){
        const index = eventData.events.findIndex(a => a.id === currentEventItemId);

        }
        currentEventItemId = null;
        saveAndRender();
      }

      function renderView(){
        renderListView();
        renderGanttView();
      }
    
      function renderListView() {
        dom.eventView.innerHTML = '';
    
        if (eventData.events.length === 0) {
          dom.eventView.innerHTML = '<div class="no-items">Nothing to event!</div>';
          return;
        }
    
        eventData.events.sort((a, b) => {
          if (a.startDate !== b.startDate){ //where dates are not the same
            return a.startDate.localeCompare(b.startDate); //sort date
          }
          return a.startTime.localeCompare(b.startTime); //sort time
        });
    
        eventData.events.forEach(item => {
          const typeLowerCase = item.type.toLowerCase();
          const todayStyle = (todayStr===item.startDate)? 'is-today':'';
          const event = planitDivCreator(null, `gen-item eventit-item ${typeLowerCase} eventing-${item.eventing} ${todayStyle}`)
          event.dataset.id = item.id;
          event.onclick = () => updateSidePanel(item);
    
          const title =  planitDivCreator(item.title, 'eventit-title');
          const startDate =  planitDivCreator(item.startDate, 'eventit-title');
          const startTime =  planitDivCreator(item.startTime, 'eventit-title');
          const type =  planitDivCreator(item.type, 'eventit-title');
    
          event.appendChild(title);
          event.appendChild(startDate);
          event.appendChild(startTime);
          event.appendChild(type);
    
          dom.eventView.appendChild(event);
        });
      }
    
      // --- Gantt View ---
    
      let ganttDays = 20;
      let startDate = new Date();
      let filteredTasks = [];
    
      const todaysDate = formatDate(new Date());
    
    
      function changeDayRangeAndDate(dayRange, dateStr){
        ganttDays = dayRange;
        startDate = new Date(dateStr);
        renderGanttView();
      }
    
      function forward(){
        const day = new Date(startDate);
        day.setDate(day.getDate() + 1);
        startDate = formatDate(day);
        changeDayRangeAndDate(ganttDays, startDate);
       }
    
      function back(){
        const day = new Date(startDate);
        day.setDate(day.getDate() - 1);
        startDate = formatDate(day);
        changeDayRangeAndDate(ganttDays, startDate);
      }
    
      function zoomOut(){
        ganttDays++;
        changeDayRangeAndDate(ganttDays, startDate);
      }
    
      function zoomIn(){
        ganttDays--;
        changeDayRangeAndDate(ganttDays, startDate);
      }
    
      function dateDiffInDays(a, b) {
        const MS_PER_DAY = 1000 * 60 * 60 * 24;
        return Math.round((b - a) / MS_PER_DAY);
      }
    
      function getDateRange(tasks) {
        if (!tasks.length) return { startDate: null, endDate: null };
        let earliest = tasks[0].startDate;
        let latest = tasks[0].endDate;
        for (const task of tasks) {
          if (task.startDate < earliest) earliest = task.startDate;
          if (task.endDate > latest) latest = task.endDate;
        }
        return { startDate: earliest, endDate: latest };
      }
    
      function showAll(){
        const dateRange = getDateRange(filteredTasks);
        if(dateRange.startDate){
          const durationInDays = dateDiffInDays(new Date(dateRange.startDate), new Date(dateRange.endDate));
          changeDayRangeAndDate(durationInDays + 1, dateRange.startDate);
        }
      }

        dom.ganttViewTwo.innerHTML = '';

        eventData.events.sort((a, b) => a.startDate.localeCompare(b.startDate)); // A-Z by category

        eventData.events.forEach(event => {
          const eventContainer = planitDivCreator(null, 'event-container');
