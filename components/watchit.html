<section id="watchit" class="card watchit-card">  
  <!-- Main Panel -->
  <div class="card-main">
    <div>
      <input id="titleInput" type="text" placeholder="New show...">   
      <button id="addNewButton">+ Add New</button>  
    </div>  
    <div id="watchView" class="watch-view"></div>
  </div>
  
  <!-- Side Panel -->
  <div id="sidePanel" class="card-side-panel">
    <div>
      <button id="exportDataButton" aria-label="Export Data">
        Export Data
      </button>     
      <button id="importDataButton" aria-label="Import Data">
        Import Data
      </button> 
      <input type="file" id="hiddenFileInput" class="planit-hidden" />
    </div>
        
    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title">
    </div>
    <div class="field">
      <label for="service">Service</label>
      <input type="text" id="service">
    </div>
    <div class="field">
      <label for="type">Type</label>
      <select id="type">
        <option>Movie</option>
        <option>Series</option>
        <option>Documentary</option>
        <option>Anime</option>
      </select>
    </div>
    <div class="field">
      <label for="day">Day</label>
      <select id="day">
        <option placeholder="Day to watch..."></option>
        <option>Monday</option>
        <option>Tuesday</option>
        <option>Wednesday</option>
        <option>Thursday</option>
        <option>Friday</option>
        <option>Saturday</option>
        <option>Sunday</option>
      </select>
    </div>
    <div class="field">
      <label>Watching</label>
      <input type="checkbox" id="watching">
    </div>
    <div class="field">
      <label>Tags (comma separated)</label>
      <input type="text" id="tags">
    </div>
  </div>
  <div id="toggleButton" class="side-panel-toggle-button"></div>
</section>
