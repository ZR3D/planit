<section id="taskit" class="card taskit-card">
  <!-- Main Panel -->
  <div class="card-main">    
    <div class="planit-flex">
      <button id="prevWeekBtn" class="svg-nav-button" aria-label="previous">
        <img src="images/previous.svg" class="card-nav-icon" />
        previous
      </button>  
      
        <button id="copyRepeatsBtn" class="svg-nav-button" aria-label="previous">
          <img src = "images/copy_repeating_alt.svg" class="card-nav-icon" alt="previous"/>
          copy repeating
        </button>
        <select id="dateSelector"></select>
        <input id="taskStr"type="text" placeholder="New task..." />
        <button class="add-task-btn svg-nav-button" data-day="${dayStr}" aria-label="add task">
          <img src="images/add.svg" class="card-nav-icon" />
          add task
        </button>  
        <div id="del" class="planit-inline-center"><svg class="nav-icon"><use href="#delete"></use></svg><div class="planit-left-1">Drag here to remove</div></div>
        <div class="planit-fill"> </div>
       <button id="nextWeekBtn" class="svg-nav-button" aria-label="next">
        <img src="images/next.svg" class="card-nav-icon" />
        next    
      </button>    
  </div>

<div class="week-progress">
  <div class="progress-bar">
  <div class="progress-fill"></div>
  <div class="started-fill"></div>
  </div>
  <span class="progress-text">0 of 0 tasks complete</span>
</div>

<div id="allColumn" class="multi-column-container"></div>
<div id="confetti" class="confetti"></div>

</div>

  <!-- Side Panel -->
  <div id="sidePanel" class="card-side-panel">
    <div>
      <button id="exportDataButton" aria-label="Export Data">
        Export Data
      </button>     
      <button id="importDataButton" aria-label="Import Data">
        Import Data
      </button> 
      <input type="file" id="hiddenFileInput" class="planit-hidden" />
    </div>
    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title">
    </div>
    <!--
    <div class="field">
      <label for="service">Service</label>
      <input type="text" id="service">
    </div>
    -->
    <div class="field">
      <label for="type">Status</label>
      <select id="status">
        <option>not-started</option>
        <option>complete</option>
        <option>started</option>
        <option>ignore</option>
      </select>
    </div>
    <div class="field">
      <label for="type">Repeat</label>
      <select id="panelRepeat">
        <option>no</option>
        <option>yes</option>
      </select>
    </div>
    <!--
    <div class="field">
      <label>Repeat</label>
      <input type="checkbox" id="repeat">
    </div>
    <div class="field">
      <label>Series</label>
      <input type="checkbox" id="series">
    </div>
    <div class="field">
      <label>Tags (comma separated)</label>
      <input type="text" id="tags">
    </div>
    -->
    <button onclick="saveItem()">Save</button>
  </div>
  <div id="toggleButton" class="side-panel-toggle-button"></div>
</section>
