<section id="buildit" class="card buildit-card">  
  <!-- Main Panel -->
  <div class="card-main">
    <div>  
      
      <label for="projectSelect">Project</label>
      <select id="projectSelect" placeholder="Select project...">
      <option></option>
      </select>
      
      
      <input id="titleInput" type="text" placeholder="New build project...">   
      <button id="addNewButton">+ Add New</button>  
    </div>  
    <div id="buildView" class="build-view"></div>
    
  <!-- Gantt View -->  
  <div class="planit-margin-bottom">
  <button id="showAllButton">show all</button>
  <button id="zoomOutButton">zoom out</button>
  <button id="zoomInButton">zoom in</button>
  <button id="backButton">back</button>
  <button id="forwardButton">forward</button>
  </div>
  <div class="gantt-container" id="gantt"></div>
    
  </div>
  
  <!-- Side Panel -->
  <div id="sidePanel" class="card-side-panel">
    <div>
      <button id="exportDataButton" aria-label="Export Data">
        Export Data
      </button>     
      <button id="importDataButton" aria-label="Import Data">
        Import Data
      </button> 
      <input type="file" id="hiddenFileInput" class="planit-hidden" />
    </div>
        
    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title">
    </div>
    <div class="field">
      <label for="service">Service</label>
      <input type="text" id="service">
    </div>
    <div class="field">
      <label for="type">Type</label>
      <select id="type">
        <option>Movie</option>
        <option>Series</option>
        <option>Documentary</option>
        <option>Anime</option>
      </select>
    </div>
    <div class="field">
      <label>Building</label>
      <input type="checkbox" id="building">
    </div>
    <div class="field">
      <label>Series</label>
      <input type="checkbox" id="series">
    </div>
    <div class="field">
      <label>Tags (comma separated)</label>
      <input type="text" id="tags">
    </div>
    <button id="saveButton">Save</button>
  </div>
  <div id="toggleButton" class="side-panel-toggle-button"></div>
</section>
