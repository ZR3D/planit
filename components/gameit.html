<section id="gameit" class="card gameit-card">  
  <!-- Main Panel -->
  <div class="card-main">
    <div>
      <input id="titleInput" type="text" placeholder="New game...">   
      <button id="addNewButton">+ Add New</button>  
    </div>  
    <div id="gameView" class="watch-view"></div>
  </div>
  
  <!-- Side Panel -->
  <div id="sidePanel" class="card-side-panel">
    <div>
      <button id="exportDataButton" aria-label="Export Data">
        Export Data
      </button>     
      <button id="importDataButton" aria-label="Import Data">
        Import Data
      </button> 
      <input type="file" id="hiddenFileInput" class="planit-hidden" />
    </div>
    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title">
    </div>
    <div class="field">
      <label for="service">Platform</label>
      <input type="text" id="platform" placeholder="PC, PS5, Switch, Steam, etc.">
    </div>
    <div class="field">
      <label for="type">Genre</label>
      <select id="genre">
        <option>Action</option>
        <option>Adventure</option>
        <option>Historical Fiction</option>  
        <option>Puzzle</option>
        <option>Racing</option>
        <option>Role-Playing</option>  
        <option>Sandbox</option>
        <option>Simulation</option>        
        <option>Sports</option>
        <option>Strategy</option>      
      </select>
    </div>
    <div class="field">
      <label>Playing</label>
      <input type="checkbox" id="playing">
    </div>
    <div class="field">
      <label>Tags (comma separated)</label>
      <input type="text" id="tags">
    </div>
    <button id="saveButton">Save</button>
  </div>
  <div id="toggleButton" class="side-panel-toggle-button"></div>
  <!--end side panel-->  
</section>
